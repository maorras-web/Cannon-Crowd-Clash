<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Shooter 3D - Deluxe Enemies Edition</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        /* UI overlay */
        #ui {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(0,255,255,0.7);
        }

        .hud-card {
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 16px;
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 255, 0.3);
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui">
        <div class="hud-card" id="score">SCORE: 0</div>
        <div class="hud-card" id="level">LEVEL 1</div>
    </div>

    <div id="canvas-container"></div>

    <script>
        // --- 1. SETUP SCENE & RENDERER ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050510, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 4, 10);
        camera.lookAt(0, 0, -20);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // --- 2. LIGHTS ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 20, 10);
        scene.add(dirLight);

        // --- 3. TRACK & ENVIRONMENT ---
        const trackGeo = new THREE.PlaneGeometry(12, 300);
        const trackMat = new THREE.MeshStandardMaterial({ 
            color: 0x0a0a1a, 
            roughness: 0.1, 
            metalness: 0.8 
        });
        const track = new THREE.Mesh(trackGeo, trackMat);
        track.rotation.x = -Math.PI / 2;
        track.position.z = -140;
        scene.add(track);

        // Neon Edges
        const edgeGeo = new THREE.BoxGeometry(0.2, 0.2, 300);
        const edgeMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
        const leftEdge = new THREE.Mesh(edgeGeo, edgeMat);
        leftEdge.position.set(-6, 0.1, -140);
        const rightEdge = new THREE.Mesh(edgeGeo, edgeMat);
        rightEdge.position.set(6, 0.1, -140);
        scene.add(leftEdge, rightEdge);

        // Stars Background
        const starsGeo = new THREE.BufferGeometry();
        const starsCount = 800;
        const starPos = new Float32Array(starsCount * 3);
        for(let i=0; i<starsCount*3; i++) {
            starPos[i] = (Math.random() - 0.5) * 200;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.5 });
        const starField = new THREE.Points(starsGeo, starsMat);
        scene.add(starField);

        // --- 4. CANNON (PLAYER) ---
        const playerGroup = new THREE.Group();
        const cannonBaseGeo = new THREE.SphereGeometry(1.2, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2);
        const cannonBaseMat = new THREE.MeshStandardMaterial({ color: 0x8a2be2, metalness: 0.7, roughness: 0.2 });
        const cannonBase = new THREE.Mesh(cannonBaseGeo, cannonBaseMat);
        playerGroup.add(cannonBase);

        // Pipes
        const pipeGeo = new THREE.CylinderGeometry(0.2, 0.2, 1.2);
        const pipeMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9, roughness: 0.1 });
        const pipe1 = new THREE.Mesh(pipeGeo, pipeMat);
        pipe1.rotation.x = Math.PI / 2;
        pipe1.position.set(-0.4, 0.6, -0.6);
        const pipe2 = pipe1.clone();
        pipe2.position.set(0.4, 0.6, -0.6);
        playerGroup.add(pipe1, pipe2);

        playerGroup.position.set(0, 0, 2);
        scene.add(playerGroup);

        // --- 5. ENEMY CREATION FUNCTIONS ---

        // 5A. Neon Cyber Robot
        function createCyberRobot(color = 0xff0055) {
            const robotGroup = new THREE.Group();

            // Body
            const bodyGeo = new THREE.IcosahedronGeometry(0.8, 0);
            const bodyMat = new THREE.MeshStandardMaterial({
                color: 0x111122,
                metalness: 0.8,
                roughness: 0.2,
                flatShading: true
            });
            const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
            bodyMesh.name = "body";
            robotGroup.add(bodyMesh);

            // Glowing Core
            const coreGeo = new THREE.SphereGeometry(0.4, 16, 16);
            const coreMat = new THREE.MeshBasicMaterial({ color: color });
            const coreMesh = new THREE.Mesh(coreGeo, coreMat);
            robotGroup.add(coreMesh);

            // Glowing Ring
            const ringGeo = new THREE.TorusGeometry(1.1, 0.05, 8, 24);
            const ringMat = new THREE.MeshBasicMaterial({ color: color });
            const ringMesh = new THREE.Mesh(ringGeo, ringMat);
            ringMesh.name = "glowingRing";
            robotGroup.add(ringMesh);

            // Mechanical Legs
            const legGeo = new THREE.CylinderGeometry(0.04, 0.08, 0.8);
            const legMat = new THREE.MeshStandardMaterial({ color: 0x333344, metalness: 0.9, roughness: 0.1 });
            for (let i = 0; i < 4; i++) {
                const leg = new THREE.Mesh(legGeo, legMat);
                const angle = (i / 4) * Math.PI * 2;
                leg.position.set(Math.cos(angle) * 0.8, -0.2, Math.sin(angle) * 0.8);
                leg.rotation.z = Math.PI / 4;
                leg.rotation.y = angle;
                robotGroup.add(leg);
            }

            robotGroup.userData = { type: 'robot', hp: 3, maxHp: 3, originalColor: color };
            return robotGroup;
        }

        // 5B. Crystal Void Monster
        function createCrystalMonster(color = 0x00ffff) {
            const crystalGroup = new THREE.Group();

            // Outer Crystal
            const outerGeo = new THREE.OctahedronGeometry(1.0, 0);
            const outerMat = new THREE.MeshPhysicalMaterial({
                color: color,
                metalness: 0.1,
                roughness: 0.1,
                transmission: 0.6,
                transparent: true,
                opacity: 0.9,
                flatShading: true
            });
            const outerMesh = new THREE.Mesh(outerGeo, outerMat);
            outerMesh.name = "outerCrystal";
            crystalGroup.add(outerMesh);

            // Inner Energy Wireframe
            const innerGeo = new THREE.IcosahedronGeometry(0.45, 1);
            const innerMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true });
            const innerMesh = new THREE.Mesh(innerGeo, innerMat);
            innerMesh.name = "innerCore";
            crystalGroup.add(innerMesh);

            crystalGroup.userData = { type: 'crystal', hp: 5, maxHp: 5, originalColor: color };
            return crystalGroup;
        }

        // --- 6. GAME LOGIC & ARRAYS ---
        const bullets = [];
        const enemies = [];
        let score = 0;
        const clock = new THREE.Clock();

        // Spawn Enemies Routine
        function spawnEnemyCluster() {
            const zPos = -80 - Math.random() * 50;
            const xPos = (Math.random() - 0.5) * 8;
            
            // Randomly choose enemy type
            const isCrystal = Math.random() > 0.5;
            const enemy = isCrystal ? createCrystalMonster(0x00ffcc) : createCyberRobot(0xff0055);
            
            enemy.position.set(xPos, 1.2, zPos);
            scene.add(enemy);
            enemies.push(enemy);
        }

        for (let i = 0; i < 8; i++) {
            spawnEnemyCluster();
        }

        // Shooting Logic
        function shootBullet() {
            const bulletGeo = new THREE.SphereGeometry(0.25, 8, 8);
            const bulletMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
            
            const b1 = new THREE.Mesh(bulletGeo, bulletMat);
            b1.position.set(playerGroup.position.x - 0.4, 0.6, playerGroup.position.z - 1);
            
            const b2 = new THREE.Mesh(bulletGeo, bulletMat);
            b2.position.set(playerGroup.position.x + 0.4, 0.6, playerGroup.position.z - 1);

            scene.add(b1, b2);
            bullets.push(b1, b2);
        }

        let lastShoot = 0;

        // --- 7. CONTROLS ---
        let isDragging = false;
        let previousMouseX = 0;

        window.addEventListener('pointerdown', (e) => {
            isDragging = true;
            previousMouseX = e.clientX;
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - previousMouseX;
            playerGroup.position.x += deltaX * 0.015;
            playerGroup.position.x = Math.max(-4.8, Math.min(4.8, playerGroup.position.x));
            previousMouseX = e.clientX;
        });

        window.addEventListener('pointerup', () => isDragging = false);

        // --- 8. ANIMATION & GAME LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            // Automatic Shooting
            if (elapsedTime - lastShoot > 0.18) {
                shootBullet();
                lastShoot = elapsedTime;
            }

            // Bullet Movement
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.position.z -= 0.8;

                if (b.position.z < -150) {
                    scene.remove(b);
                    bullets.splice(i, 1);
                }
            }

            // Enemy Animations & Collision Check
            for (let eIdx = enemies.length - 1; eIdx >= 0; eIdx--) {
                const enemy = enemies[eIdx];

                // 1. Move Enemy forward
                enemy.position.z += 0.08;

                // 2. Custom Type Animations
                if (enemy.userData.type === 'crystal') {
                    enemy.position.y = 1.2 + Math.sin(elapsedTime * 3 + enemy.position.z) * 0.2;
                    const outer = enemy.getObjectByName("outerCrystal");
                    const inner = enemy.getObjectByName("innerCore");
                    if (outer) outer.rotation.y += 0.015;
                    if (inner) {
                        inner.rotation.y -= 0.03;
                        const scale = 1 + Math.sin(elapsedTime * 6) * 0.12;
                        inner.scale.set(scale, scale, scale);
                    }
                } 
                else if (enemy.userData.type === 'robot') {
                    const ring = enemy.getObjectByName("glowingRing");
                    if (ring) {
                        ring.rotation.x += 0.03;
                        ring.rotation.y += 0.04;
                    }
                }

                // Reset position if passed player
                if (enemy.position.z > 5) {
                    enemy.position.z = -100 - Math.random() * 30;
                    enemy.position.x = (Math.random() - 0.5) * 8;
                }

                // Bullet Collision Check
                for (let bIdx = bullets.length - 1; bIdx >= 0; bIdx--) {
                    const b = bullets[bIdx];
                    const dist = b.position.distanceTo(enemy.position);

                    if (dist < 1.0) {
                        // Remove Bullet
                        scene.remove(b);
                        bullets.splice(bIdx, 1);

                        // Damage Enemy
                        enemy.userData.hp--;

                        // Hit Flash Effect (Scale briefly)
                        enemy.scale.set(1.2, 1.2, 1.2);
                        setTimeout(() => enemy.scale.set(1, 1, 1), 50);

                        // Enemy Destroyed
                        if (enemy.userData.hp <= 0) {
                            scene.remove(enemy);
                            enemies.splice(eIdx, 1);
                            score += 100;
                            document.getElementById('score').innerText = `SCORE: ${score}`;
                            spawnEnemyCluster(); // Respawn
                            break;
                        }
                    }
                }
            }

            renderer.render(scene, camera);
        }

        // Resize Listener
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
