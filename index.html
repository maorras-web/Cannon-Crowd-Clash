<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ball Blast 2D</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 0. מסך פתיח מקדים (Splash Screen) -->
    <div id="splash-screen">
        <div class="splash-content">
            <p class="splash-tap-text">TAP ANYWHERE TO START</p>
        </div>
    </div>

    <!-- אזהרה למחשבים שולחניים -->
    <div id="mobile-only-warning">
        <h2>MOBILE ONLY</h2>
        <p>Please open this game on your mobile phone!</p>
    </div>

    <!-- HUD במהלך המשחק -->
    <div id="ui-container">
        <!-- מד חיים (1000 HP) -->
        <div id="hp-container">
            <div id="hp-bar"></div>
            <span id="hp-text">1000 / 1000</span>
        </div>

        <!-- מד שלב -->
        <div id="level-bar-container">
            <span id="level-text">LEVEL 1</span>
            <div class="progress-outer">
                <div id="level-progress-fill"></div>
            </div>
        </div>

        <!-- מד מטבעות -->
        <div id="coin-card">
            <span class="coin-icon">🪙</span>
            <span id="coins-val">0</span>
        </div>

        <!-- ניקוד -->
        <div id="score-card">
            <span class="score-label">SCORE</span>
            <span id="score-val">0</span>
        </div>

        <!-- כפתור Pause -->
        <button id="pause-btn" class="icon-btn">⏸</button>
    </div>

    <!-- 1. מסך תפריט ראשי -->
    <div id="start-overlay">
        <div id="start-menu">
            <div class="header-section">
                <h1 class="game-title">BALL BLAST</h1>
                <p class="game-subtitle">Destroy bouncing spheres & upgrade your cannon!</p>
            </div>

            <div class="best-badge">
                BEST SCORE: <span id="start-best-score">0</span>
            </div>

            <div class="coins-badge" style="color: #facc15; font-weight: bold; margin-bottom: 20px;">
                TOTAL COINS: 🪙 <span id="start-coins">0</span>
            </div>

            <div class="action-section">
                <button id="start-btn" class="btn">START GAME</button>
            </div>
        </div>
    </div>

    <!-- 2. תפריט עצירה (Pause) -->
    <div id="pause-menu" class="hidden">
        <div class="pause-card">
            <h2>GAME PAUSED</h2>

            <div class="customization-section" style="margin: 20px 0;">
                <span class="section-label" style="color: #94a3b8; font-size: 12px; display: block; margin-bottom: 10px;">CANNON COLOR</span>
                <div class="color-picker" style="display: flex; justify-content: center; gap: 10px;">
                    <button class="color-btn active" style="background: #2563eb; width: 30px; height: 30px; border-radius: 50%; border: 2px solid #fff; cursor: pointer;" onclick="changeCannonColor('#2563eb')"></button>
                    <button class="color-btn" style="background: #dc2626; width: 30px; height: 30px; border-radius: 50%; border: 2px solid #fff; cursor: pointer;" onclick="changeCannonColor('#dc2626')"></button>
                    <button class="color-btn" style="background: #16a34a; width: 30px; height: 30px; border-radius: 50%; border: 2px solid #fff; cursor: pointer;" onclick="changeCannonColor('#16a34a')"></button>
                    <button class="color-btn" style="background: #9333ea; width: 30px; height: 30px; border-radius: 50%; border: 2px solid #fff; cursor: pointer;" onclick="changeCannonColor('#9333ea')"></button>
                </div>
            </div>

            <button id="resume-btn" class="btn">RESUME</button>
            <button id="restart-from-pause-btn" class="btn btn-restart" style="margin-top: 10px;">RESTART</button>
        </div>
    </div>

    <!-- 3. מסך Game Over -->
    <div id="game-over-modal" class="hidden">
        <div class="pause-card">
            <h2 style="color: #ef4444; font-size: 24px;">GAME OVER</h2>
            <p style="font-size: 1.1rem; color: #fff; margin: 10px 0;">SCORE: <strong id="final-score-val" style="color: #38bdf8;">0</strong></p>
            <p style="font-size: 1rem; color: #facc15; margin: 5px 0;">COINS: 🪙 <strong id="final-coins-val">0</strong></p>
            <p style="font-size: 0.9rem; color: #94a3b8; margin-bottom: 20px;">BEST: <span id="best-score-val">0</span></p>
            <button id="restart-btn" class="btn btn-restart">PLAY AGAIN</button>
        </div>
    </div>

    <script src="main.js?v=6"></script>
</body>
</html>
