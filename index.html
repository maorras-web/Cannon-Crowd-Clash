<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cannon Crowd Clash</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #050714;
            font-family: 'Rubik', system-ui, -apple-system, sans-serif;
            touch-action: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        /* חסימה למחשבים שולחניים - מיועד למובייל בלבד */
        #mobile-only-warning {
            display: none;
            position: fixed;
            inset: 0;
            background: #050714;
            color: #ffffff;
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        #mobile-only-warning h2 {
            font-size: 2rem;
            color: #38bdf8;
            margin-bottom: 10px;
        }

        /* מציג אזהרה במחשבים (מסכים מעל 600 פיקסלים) */
        @media (min-width: 601px) {
            #mobile-only-warning {
                display: flex !important;
            }
        }

        /* UI overlay elements */
        .hud-container {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            pointer-events: none;
        }

        /* HP Bar Container - קומפקטי לניידים */
        #hp-container {
            position: relative;
            width: 110px;
            height: 22px;
            background-color: rgba(15, 23, 42, 0.85);
            border: 1.5px solid rgba(255, 255, 255, 0.8);
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
        }

        #hp-bar {
            width: 100%;
            height: 100%;
            background-color: #22c55e;
            box-shadow: 0 0 8px #22c55e;
            transition: width 0.25s ease-out, background-color 0.3s ease, box-shadow 0.3s ease;
        }

        #hp-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff;
            font-weight: 700;
            font-size: 11px;
            text-shadow: 0px 1px 3px rgba(0, 0, 0, 0.9);
            letter-spacing: 0.5px;
        }

        /* כפתור הפסקה במרכז למעלה */
        .icon-btn {
            pointer-events: auto;
            background: rgba(15, 23, 42, 0.85);
            border: 1.5px solid rgba(255, 255, 255, 0.8);
            border-radius: 10px;
            width: 38px;
            height: 38px;
            font-size: 1rem;
            cursor: pointer;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            transition: transform 0.1s, background 0.2s;
        }

        .icon-btn:active {
            transform: scale(0.92);
        }

        /* Score Card */
        #score-card {
            background: rgba(15, 23, 42, 0.85);
            border: 1.5px solid rgba(255, 255, 255, 0.8);
            padding: 4px 12px;
            border-radius: 6px;
            color: #ffffff;
            font-size: 13px;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            min-width: 80px;
            text-align: center;
        }

        /* Overlay Menus */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(5, 7, 20, 0.88);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            color: #fff;
            transition: opacity 0.4s ease;
        }

        .pause-card {
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 24px 30px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            min-width: 260px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .volume-control-menu {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 100%;
            margin-top: 5px;
        }

        .volume-control-menu label {
            font-size: 14px;
            color: #cbd5e1;
            font-weight: 600;
        }

        .volume-control-menu input[type="range"] {
            width: 100%;
            accent-color: #2563eb;
            cursor: pointer;
        }

        .hidden {
            display: none !important;
        }

        .btn {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            padding: 12px 32px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
            transition: transform 0.1s, background 0.2s;
        }

        .btn:active {
            transform: scale(0.95);
        }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- אזהרה למחשבים -->
    <div id="mobile-only-warning">
        <h2>Mobile Only</h2>
        <p>This game is designed strictly for mobile devices.<br>Please open this link on your smartphone.</p>
    </div>

    <!-- HUD Overlay -->
    <div class="hud-container">
        <!-- HP Bar -->
        <div id="hp-container">
            <div id="hp-bar"></div>
            <span id="hp-text">500 / 500</span>
        </div>

        <!-- Pause Button -->
        <button id="pause-btn" class="icon-btn" aria-label="Pause Game">⏸️</button>

        <!-- Score -->
        <div id="score-card">
            SCORE: <span id="score-val">0</span>
        </div>
    </div>

    <!-- Start Overlay -->
    <div id="start-overlay" class="overlay">
        <h1 style="font-size: 32px; margin-bottom: 8px;">Cannon Crowd Clash</h1>
        <p style="font-size: 15px; color: #cbd5e1; margin-bottom: 12px;">Drag screen to move the cannon</p>
        <button id="start-btn" class="btn">START GAME</button>
    </div>

    <!-- Pause Overlay (Includes Volume Slider) -->
    <div id="pause-menu" class="overlay hidden">
        <div class="pause-card">
            <h2>GAME PAUSED</h2>
            
            <div class="volume-control-menu">
                <label for="volume-slider">Volume</label>
                <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.25">
            </div>

            <button id="resume-btn" class="btn">RESUME</button>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
