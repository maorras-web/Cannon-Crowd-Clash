<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ball Blast 2D</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0d0f17;
            color: #ffffff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            touch-action: none;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 480px;
            background: #1a1a2e;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: auto;
        }
        .stats-group {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .stat-badge {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .icon-btn {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 20, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            pointer-events: auto;
            z-index: 10;
        }
        .hidden {
            display: none !important;
        }
        .menu-card {
            background: #16192b;
            border: 1px solid #2e3456;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 340px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 28px;
            margin-bottom: 4px;
            letter-spacing: 1px;
            color: #38bdf8;
        }
        .subtitle {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 20px;
        }
        .nav-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            background: #0f111d;
            padding: 4px;
            border-radius: 10px;
        }
        .tab-btn {
            flex: 1;
            padding: 8px;
            border: none;
            background: transparent;
            color: #94a3b8;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
        }
        .tab-btn.active {
            background: #2563eb;
            color: white;
        }
        .btn-main {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 12px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        }
        .btn-main:active {
            transform: scale(0.98);
        }
        .map-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f111d;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 8px;
            border: 1px solid transparent;
        }
        .map-card.selected {
            border-color: #22c55e;
            background: #14291f;
        }
        .map-btn {
            padding: 6px 12px;
            border-radius: 6px;
            border: none;
            background: #3b82f6;
            color: white;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
        }
        .map-btn.selected-btn {
            background: #22c55e;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div class="ui-overlay">
        <div class="top-bar">
            <div class="stats-group">
                <div class="stat-badge" id="level-display">LEVEL 1</div>
                <div class="stat-badge">🪙 <span id="coin-count">0</span></div>
            </div>
            <div class="stats-group">
                <div class="stat-badge">SCORE <span id="score-display">0</span></div>
                <button class="icon-btn" id="pause-btn">⏸</button>
            </div>
        </div>
    </div>

    <!-- תפריט ראשי -->
    <div id="main-menu" class="modal">
        <div class="menu-card">
            <h1>BALL BLAST 2D</h1>
            <div class="subtitle">שדרג את התותח ופתח מפות חדשות!</div>

            <div class="stat-badge" style="justify-content: center; margin-bottom: 16px;">
                BEST: <span id="best-score-display">0</span> &nbsp;|&nbsp; 🪙 <span id="menu-coin-count">0</span>
            </div>

            <div class="nav-tabs">
                <button class="tab-btn active" id="tab-btn-shop">SHOP</button>
                <button class="tab-btn" id="tab-btn-maps">MAPS</button>
            </div>

            <div id="tab-shop" class="tab-content">
                <div style="font-size: 13px; color: #94a3b8; margin-bottom: 12px;">שדרוגים זמינים בחנות</div>
                <button id="upgrade-fire-rate" class="btn-main" style="background: #334155; margin-top: 0;">קצב ירי (🪙 100)</button>
            </div>

            <div id="tab-maps" class="tab-content hidden">
                <div class="map-card selected" id="map-card-day">
                    <span>☀️ DAY MOUNTAINS</span>
                    <button id="select-map-day" class="map-btn selected-btn">SELECTED</button>
                </div>
                <div class="map-card" id="map-card-sunset">
                    <span>🌅 SUNSET HILLS</span>
                    <button id="select-map-sunset" class="map-btn">🪙 3000</button>
                </div>
                <div class="map-card" id="map-card-space">
                    <span>🌌 NEON SPACE</span>
                    <button id="select-map-space" class="map-btn">🪙 4000</button>
                </div>
            </div>

            <button id="start-btn" class="btn-main">START GAME</button>
        </div>
    </div>

    <!-- מסך GAME OVER -->
    <div id="game-over-menu" class="modal hidden">
        <div class="menu-card">
            <h1 style="color: #ef4444;">GAME OVER</h1>
            <div style="margin: 16px 0; font-size: 14px; line-height: 1.6;">
                SCORE: <b id="final-score" style="color: #38bdf8;">0</b><br>
                COINS: <b id="final-coins" style="color: #facc15;">0</b><br>
                BEST: <b id="final-best">0</b>
            </div>
            <button id="restart-btn" class="btn-main">PLAY AGAIN</button>
            <button id="to-menu-btn" class="btn-main" style="background: #334155;">MAIN MENU / SHOP</button>
        </div>
    </div>
</div>

<script src="main.js"></script>
</body>
</html>
