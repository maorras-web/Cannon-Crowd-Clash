<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Spike Wheel Runner 3D - Curved Skyway</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #64b5f6;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #mobile-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 480px;
            background-color: #64b5f6;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.3);
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        #ui {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            display: flex;
            justify-content: space-between;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            pointer-events: none;
            z-index: 10;
        }

        .hud-card {
            background: rgba(20, 50, 30, 0.75);
            padding: 8px 14px;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
        }

        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 35, 25, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: #fff;
            padding: 20px;
        }

        #start-screen h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #a8ff78;
            text-shadow: 0 0 10px #78ffd6;
            text-align: center;
            letter-spacing: 2px;
        }

        #start-screen p {
            font-size: 15px;
            color: #e0e0e0;
            margin-bottom: 30px;
            text-align: center;
        }

        .btn-start {
            padding: 16px 42px;
            font-size: 20px;
            font-weight: bold;
            color: #1a3c27;
            background: #a8ff78;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px #a8ff78;
            transition: transform 0.2s, background 0.2s;
        }

        .btn-start:active {
            transform: scale(0.95);
            background: #78ffd6;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="mobile-wrapper">
        <div id="start-screen">
            <h1>FOREST SKYWAY 3D</h1>
            <p>Drag left/right to steer • Double Tap to JUMP!</p>
            <button class="btn-start" id="start-btn">START RUN</button>
        </div>

        <div id="ui">
            <div class="hud-card" id="score">DISTANCE: 0m</div>
            <div class="hud-card" id="level">STAGE 1</div>
        </div>

        <div id="canvas-container"></div>
    </div>

    <script>
        let gameStarted = false;

        // --- 1. SETUP SCENE & CAMERA (CAMERA RETRACTED / WIDER FOV) ---
        const wrapper = document.getElementById('mobile-wrapper');
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        scene.background = new THREE.Color(0x64b5f6);
        scene.fog = new THREE.FogExp2(0x90caf9, 0.005);

        // מצלמה מורחקת יותר (FOV: 70, Height: 10, Distance: 17)
        const camera = new THREE.PerspectiveCamera(70, wrapper.clientWidth / wrapper.clientHeight, 0.1, 1000);
        camera.position.set(0, 10, 17);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(wrapper.clientWidth, wrapper.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // --- 2. LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfffaed, 1.2);
        sunLight.position.set(30, 50, 20);
        scene.add(sunLight);

        // --- 3. DYNAMIC CURVED TRACK CREATION ---
        const trackWidth = 14;
        const trackLength = 400;
        const numPoints = 100;
        const curvePoints = [];

        // יצירת מסלול עם עיקולים ועליות/מורדות
        for (let i = 0; i <= numPoints; i++) {
            const z = - (i / numPoints) * trackLength;
            const x = Math.sin(i * 0.15) * 12; // עיקולים ימינה ושמאלה
            const y = Math.sin(i * 0.1) * 8;   // עליות ומורדות
            curvePoints.push(new THREE.Vector3(x, y, z));
        }

        const pathCurve = new THREE.CatmullRomCurve3(curvePoints);

        // טקסטורת מסלול
        const canvas = document.createElement('canvas');
        canvas.width = 256; canvas.height = 256;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#2c3e50'; ctx.fillRect(0, 0, 256, 256);
        ctx.strokeStyle = '#00e676'; ctx.lineWidth = 6;
        ctx.strokeRect(0, 0, 256, 256);

        const gridTexture = new THREE.CanvasTexture(canvas);
        gridTexture.wrapS = THREE.RepeatWrapping; gridTexture.wrapT = THREE.RepeatWrapping;
        gridTexture.repeat.set(4, 80);

        // יצירת הגאומטריה המפותלת
        const trackGeo = new THREE.TubeGeometry(pathCurve, 200, trackWidth / 2, 2, false);
        
        // השטחת הצינור לצורת משטח רחב
        const posAttr = trackGeo.attributes.position;
        for (let i = 0; i < posAttr.count; i++) {
            if (i % 2 === 0) {
                posAttr.setY(i, posAttr.getY(i) * 0.05); // פרופיל שטוח
            }
        }
        trackGeo.computeVertexNormals();

        const trackMat = new THREE.MeshStandardMaterial({ map: gridTexture, roughness: 0.4, side: THREE.DoubleSide });
        const track = new THREE.Mesh(trackGeo, trackMat);
        scene.add(track);

        // קרקע יער למטה
        const forestGroundGeo = new THREE.PlaneGeometry(600, 600);
        const forestGroundMat = new THREE.MeshStandardMaterial({ color: 0x2e7d32, roughness: 0.9 });
        const forestGround = new THREE.Mesh(forestGroundGeo, forestGroundMat);
        forestGround.rotation.x = -Math.PI / 2;
        forestGround.position.set(0, -25, -150);
        scene.add(forestGround);

        // עצים ביער
        const treesGroup = new THREE.Group();
        const trunkGeo = new THREE.CylinderGeometry(0.5, 0.8, 4, 8);
        const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4e342e });
        const leavesGeo = new THREE.ConeGeometry(3, 8, 8);
        const leavesMat = new THREE.MeshStandardMaterial({ color: 0x1b5e20, roughness: 0.8 });

        for (let i = 0; i < 80; i++) {
            const tree = new THREE.Group();
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.y = 2;
            const leaves = new THREE.Mesh(leavesGeo, leavesMat);
            leaves.position.y = 6;
            tree.add(trunk, leaves);

            const side = Math.random() > 0.5 ? 1 : -1;
            tree.position.set(side * (25 + Math.random() * 60), -25, -Math.random() * 380);
            const scale = 0.8 + Math.random() * 0.8;
            tree.scale.set(scale, scale, scale);
            treesGroup.add(tree);
        }
        scene.add(treesGroup);

        // עננים ברקע
        const cloudsGroup = new THREE.Group();
        const cloudMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 });
        const cloudGeo = new THREE.DodecahedronGeometry(5, 1);

        for (let i = 0; i < 30; i++) {
            const cloud = new THREE.Mesh(cloudGeo, cloudMat);
            cloud.position.set(
                (Math.random() - 0.5) * 300,
                15 + Math.random() * 30,
                -Math.random() * 350
            );
            cloud.scale.set(1 + Math.random() * 2, 0.6 + Math.random() * 0.4, 1 + Math.random() * 1.5);
            cloudsGroup.add(cloud);
        }
        scene.add(cloudsGroup);

        // --- 4. SPIKE WHEEL PLAYER ---
        const playerGroup = new THREE.Group();
        const wheelGroup = new THREE.Group();

        const wheelCenterGeo = new THREE.CylinderGeometry(1.2, 1.2, 1.2, 24);
        const wheelCenterMat = new THREE.MeshStandardMaterial({ color: 0x212121, metalness: 0.8, roughness: 0.2 });
        const wheelCenter = new THREE.Mesh(wheelCenterGeo, wheelCenterMat);
        wheelCenter.rotation.z = Math.PI / 2;
        wheelGroup.add(wheelCenter);

        const spikeContainer = new THREE.Group();
        wheelGroup.add(spikeContainer);

        function rebuildSpikes(countPerSide = 6) {
            while(spikeContainer.children.length > 0) {
                spikeContainer.remove(spikeContainer.children[0]);
            }

            const spikeGeo = new THREE.ConeGeometry(0.18, 0.65, 12);
            const spikeMat = new THREE.MeshStandardMaterial({ color: 0xff1744, emissive: 0x880015, metalness: 0.6 });

            const sides = [
                { offset: -0.65, rotZ: Math.PI / 2 },
                { offset: 0.65, rotZ: -Math.PI / 2 }
            ];

            sides.forEach(side => {
                for (let i = 0; i < countPerSide; i++) {
                    const angle = (i / countPerSide) * Math.PI * 2;
                    const spike = new THREE.Mesh(spikeGeo, spikeMat);
                    
                    spike.position.set(
                        side.offset,
                        Math.cos(angle) * 0.9,
                        Math.sin(angle) * 0.9
                    );
                    
                    spike.rotation.z = side.rotZ;
                    spike.rotation.x = -angle;

                    spikeContainer.add(spike);
                }
            });
        }

        rebuildSpikes(6);

        playerGroup.add(wheelGroup);
        scene.add(playerGroup);

        // --- 5. CONTROLS & MOVEMENT ALONG CURVE ---
        let targetX = 0;
        let progress = 0; // התקדמות לאורך העקומה (0 עד 1)
        let distanceCovered = 0;

        let isJumping = false;
        let jumpVelocity = 0;
        const gravity = -0.018;
        let jumpOffsetY = 0;

        let lastTapTime = 0;

        function triggerJump() {
            if (!isJumping) {
                isJumping = true;
                jumpVelocity = 0.38;
            }
        }

        function handlePointerMove(e) {
            if (!gameStarted) return;
            const rect = wrapper.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const relativeX = clientX - rect.left;
            const normalizedX = (relativeX / rect.width) * 2 - 1;
            // הגבלה רחבה של ההיגוי שנראית מצוין גם במצלמה המורחקת
            targetX = Math.max(-5.5, Math.min(5.5, normalizedX * 6.5));
        }

        function handleTapStart(e) {
            if (!gameStarted) return;
            const currentTime = new Date().getTime();
            const tapLength = currentTime - lastTapTime;

            if (tapLength < 300 && tapLength > 0) {
                triggerJump();
            }
            lastTapTime = currentTime;
        }

        wrapper.addEventListener('pointermove', handlePointerMove);
        wrapper.addEventListener('touchmove', handlePointerMove, { passive: true });
        wrapper.addEventListener('pointerdown', handleTapStart);

        document.getElementById('start-btn').addEventListener('click', () => {
            gameStarted = true;
            document.getElementById('start-screen').style.display = 'none';

            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen().catch(err => console.log(err));
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) {
                elem.msRequestFullscreen();
            }
        });

        // --- 6. MAIN GAME LOOP ---
        let currentX = 0;

        function animate() {
            requestAnimationFrame(animate);

            if (!gameStarted) {
                renderer.render(scene, camera);
                return;
            }

            // התקדמות לאורך המסלול הדינמי
            progress += 0.0008;
            if (progress >= 0.85) progress = 0.05; // חזרה בלולאה חלקה

            distanceCovered += 0.5;
            document.getElementById('score').innerText = `DISTANCE: ${Math.floor(distanceCovered)}m`;

            // חישוב מיקום וזווית על העקומה
            const centerPos = pathCurve.getPointAt(progress);
            const tangent = pathCurve.getTangentAt(progress);

            // יצירת וקטורי כיוון (רוחב וגובה המסלול)
            const normal = new THREE.Vector3(0, 1, 0);
            const sideVector = new THREE.Vector3().crossVectors(tangent, normal).normalize();
            const upVector = new THREE.Vector3().crossVectors(sideVector, tangent).normalize();

            // החלקה של היגוי השחקן
            currentX += (targetX - currentX) * 0.15;

            // פיזיקת קפיצה
            if (isJumping) {
                jumpOffsetY += jumpVelocity;
                jumpVelocity += gravity;

                if (jumpOffsetY <= 0) {
                    jumpOffsetY = 0;
                    isJumping = false;
                    jumpVelocity = 0;
                }
            }

            // מיקום הגלגל לפי המסלול + צידוד רוחבי + גובה קפיצה
            const wheelPos = centerPos.clone()
                .add(sideVector.clone().multiplyScalar(currentX))
                .add(upVector.clone().multiplyScalar(1.3 + jumpOffsetY));

            playerGroup.position.copy(wheelPos);

            // התאמת סיבוב הגלגל לשיפוע העיקול והעלייה
            playerGroup.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, -1), tangent);

            // סיבוב הגלגל סביב עצמו
            wheelGroup.rotation.x -= 0.2;

            // התאמת המצלמה (עוקבת במרחק בטוח מאחורי הגלגל)
            const camOffset = tangent.clone().multiplyScalar(-16).add(upVector.clone().multiplyScalar(8));
            camera.position.copy(centerPos).add(camOffset);
            camera.lookAt(centerPos.clone().add(tangent.clone().multiplyScalar(10)));

            gridTexture.offset.y -= 0.015;

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = wrapper.clientWidth / wrapper.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(wrapper.clientWidth, wrapper.clientHeight);
        });

        animate();
    </script>
</body>
</html>
