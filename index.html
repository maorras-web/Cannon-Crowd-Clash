<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cannon Crowd Clash</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="mobile-only-warning">
        <h2>Mobile Only</h2>
        <p>This game is designed for mobile devices only.<br>Please open the link on your smartphone.</p>
    </div>

    <div id="ui-container" class="hud-container">
        <div id="hp-container">
            <div id="hp-bar"></div>
            <span id="hp-text">500 / 500</span>
        </div>

        <div id="level-bar-container">
            <div id="level-text">LEVEL 1</div>
            <div class="progress-outer">
                <div id="level-progress-fill"></div>
            </div>
        </div>

        <button id="pause-btn" class="icon-btn" aria-label="Pause Game">⏸️</button>

        <div id="score-card">
            <span class="score-label">SCORE</span>
            <span id="score-val">0</span>
        </div>
    </div>

    <div id="start-overlay" class="overlay">
        <div id="start-menu">
            <div class="header-section">
                <h1 class="game-title">Cannon Crowd Clash</h1>
                <p class="game-subtitle">Drag screen to control the cannon</p>
            </div>

            <div class="best-badge">
                BEST SCORE: <span id="start-best-score">0</span>
            </div>

            <div class="action-section">
                <button id="start-btn" class="btn">START GAME</button>
            </div>
        </div>
    </div>

    <div id="pause-menu" class="overlay hidden">
        <div class="pause-card">
            <h2>GAME PAUSED</h2>
            
            <div class="customization-section">
                <span class="section-label">Select Cannon Color</span>
                <div class="color-picker">
                    <button class="color-btn active" data-color="#2563eb" style="background-color: #2563eb;"></button>
                    <button class="color-btn" data-color="#dc2626" style="background-color: #dc2626;"></button>
                    <button class="color-btn" data-color="#16a34a" style="background-color: #16a34a;"></button>
                    <button class="color-btn" data-color="#9333ea" style="background-color: #9333ea;"></button>
                </div>
            </div>

            <div class="volume-control-menu">
                <label for="volume-slider">Volume</label>
                <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.25">
            </div>

            <button id="resume-btn" class="btn">RESUME</button>
        </div>
    </div>

    <div id="game-over-modal" class="overlay hidden">
        <div class="pause-card">
            <h1 style="font-size: 2.2rem; color: #ef4444; margin-bottom: 4px;">GAME OVER</h1>
            <p style="font-size: 1.1rem; color: #cbd5e1;">SCORE: <span id="final-score-val" style="color: #fff; font-weight: bold;">0</span></p>
            <p style="font-size: 1.1rem; color: #facc15;">BEST SCORE: <span id="best-score-val" style="color: #fff; font-weight: bold;">0</span></p>
            <button id="restart-btn" class="btn btn-restart" style="margin-top: 10px;">TRY AGAIN</button>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
