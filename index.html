<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Track Shooter</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: Arial, sans-serif;
            user-select: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
            pointer-events: none;
            z-index: 10;
        }
        #boss-ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            background: rgba(0,0,0,0.6);
            border: 2px solid #ff4444;
            border-radius: 8px;
            padding: 5px;
            display: none;
            z-index: 10;
        }
        #boss-bar {
            height: 16px;
            background: #ff4444;
            width: 100%;
            border-radius: 4px;
            transition: width 0.2s;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #a5f3fc;
            font-size: 16px;
            pointer-events: none;
        }
    </style>
    <!-- טעינת Three.js מ-CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui">
        <div>ניקוד: <span id="score">0</span></div>
        <div>שלב: <span id="level">1</span></div>
        <div>התקדמות: <span id="progress">0</span>%</div>
    </div>

    <div id="boss-ui">
        <div style="color: #ff4444; text-align: center; font-size: 14px; margin-bottom: 4px;">BOSS HP</div>
        <div id="boss-bar"></div>
    </div>

    <div id="instructions">תזוזה: מקשי חצים / A, D | ירייה: רווח (Space)</div>

    <script>
        // --- 1. הגדרת סצנה, מצלמה ורנדרר ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050b14, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // --- 2. תאורה ---
        const ambientLight = new THREE.AmbientLight(0x1e293b, 1.5);
        scene.add(ambientLight);

        // תאורת מסלול עוצמתית וקבועה (מונעת חשכה)
        const trackLight = new THREE.SpotLight(0x38bdf8, 5.0, 150, Math.PI / 4, 0.5, 1);
        trackLight.position.set(0, 15, 10);
        trackLight.target.position.set(0, 0, -60);
        scene.add(trackLight);
        scene.add(trackLight.target);

        // --- 3. יצירת המסלול והסביבה ---
        const trackGeo = new THREE.PlaneGeometry(20, 400);
        const trackMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.4, metalness: 0.6 });
        const track = new THREE.Mesh(trackGeo, trackMat);
        track.rotation.x = -Math.PI / 2;
        track.position.z = -150;
        scene.add(track);

        // גבולות המסלול
        const railGeo = new THREE.BoxGeometry(0.5, 1, 400);
        const railMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
        const railLeft = new THREE.Mesh(railGeo, railMat);
        railLeft.position.set(-10, 0.5, -150);
        const railRight = railLeft.clone();
        railRight.position.x = 10;
        scene.add(railLeft, railRight);

        // --- 4. השחקן (תותח) ---
        const cannonGroup = new THREE.Group();
        const cannonBodyGeo = new THREE.BoxGeometry(1.5, 0.8, 2);
        const cannonMat = new THREE.MeshStandardMaterial({ color: 0x0284c7 });
        const cannonBody = new THREE.Mesh(cannonBodyGeo, cannonMat);
        cannonBody.position.y = 0.5;
        cannonGroup.add(cannonBody);

        cannonGroup.position.set(0, 0, 0);
        scene.add(cannonGroup);

        camera.position.set(0, 4, 8);
        camera.lookAt(cannonGroup.position.x, 1, cannonGroup.position.z - 10);

        // --- 5. משתני משחק וגאומטריות טעונות מראש ---
        const bulletGeo = new THREE.SphereGeometry(0.2, 8, 8);
        const bulletMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });

        const lizardGeo = new THREE.ConeGeometry(0.8, 2, 6);
        lizardGeo.rotateX(Math.PI / 2);
        const lizardMat = new THREE.MeshStandardMaterial({ color: 0x22c55e });

        const bossGeo = new THREE.DodecahedronGeometry(2.5);
        const bossMat = new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.2 });

        const bullets = [];
        const lizards = [];
        let activeBoss = null;

        let score = 0;
        let currentLevel = 1;
        let levelProgress = 0;
        const maxLevelProgress = 100;
        let isBossActive = false;

        let cameraShakeTime = 0;

        // --- 6. ניהול אודיו בסיסי (Web Audio API) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'shoot') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'hit') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            }
        }

        // --- 7. פונקציות ירי ואויבים ---

        // עדכון ליצירת כדור ירי + אור צמוד בכל ירייה
        function spawnBullet(x, z) {
            const bullet = new THREE.Mesh(bulletGeo, bulletMat);
            bullet.scale.set(1.2, 1.2, 2.5);
            bullet.position.set(x, 1.1, z);
            
            // נקודת אור קטנה ויעילה לכל זוג כדורים לקבלת ברק אמיתי
            const bLight = new THREE.PointLight(0x38bdf8, 2.5, 12);
            bLight.position.set(0, 0.2, 0);
            bullet.add(bLight);

            scene.add(bullet);
            bullets.push(bullet);
            playSound('shoot');
        }

        function spawnLizard() {
            if (isBossActive) return;
            const liz = new THREE.Mesh(lizardGeo, lizardMat);
            const x = (Math.random() - 0.5) * 16;
            liz.position.set(x, 0.8, -120);
            liz.userData = { hp: 2, scoreVal: 50 };
            scene.add(liz);
            lizards.push(liz);
        }

        function spawnBoss() {
            isBossActive = true;
            activeBoss = new THREE.Mesh(bossGeo, bossMat);
            activeBoss.position.set(0, 2.5, -80);
            activeBoss.userData = { hp: 30, maxHp: 30 };
            scene.add(activeBoss);
            
            document.getElementById('boss-ui').style.display = 'block';
            updateBossBar();
        }

        function triggerCameraShake(duration) {
            cameraShakeTime = duration;
        }

        function updateLevelUI() {
            document.getElementById('score').innerText = score;
            document.getElementById('level').innerText = currentLevel;
            document.getElementById('progress').innerText = Math.min(100, Math.floor((levelProgress / maxLevelProgress) * 100));
        }

        function updateBossBar() {
            if (!activeBoss) return;
            const pct = (activeBoss.userData.hp / activeBoss.userData.maxHp) * 100;
            document.getElementById('boss-bar').style.width = Math.max(0, pct) + '%';
        }

        // --- 8. לולאת עדכון הכדורים המשופרת ---
        function updateBullets(delta) {
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.position.z -= 95.0 * delta;

                let hitEnemy = false;
                for (let j = lizards.length - 1; j >= 0; j--) {
                    const liz = lizards[j];
                    if (b.position.distanceTo(liz.position) < 1.6) {
                        liz.userData.hp--;
                        if (liz.userData.hp <= 0) {
                            score += liz.userData.scoreVal;
                            levelProgress += 5;
                            updateLevelUI();
                            scene.remove(liz);
                            lizards.splice(j, 1);
                            if (levelProgress >= maxLevelProgress && !isBossActive) {
                                spawnBoss();
                            }
                        }
                        hitEnemy = true;
                        playSound('hit');
                        break;
                    }
                }

                if (hitEnemy) {
                    scene.remove(b);
                    bullets.splice(i, 1);
                    continue;
                }

                if (isBossActive && activeBoss && b.position.distanceTo(activeBoss.position) < 3.5) {
                    activeBoss.userData.hp--;
                    updateBossBar();
                    playSound('hit');
                    triggerCameraShake(0.1);
                    scene.remove(b);
                    bullets.splice(i, 1);

                    if (activeBoss.userData.hp <= 0) {
                        scene.remove(activeBoss);
                        activeBoss = null;
                        isBossActive = false;
                        score += 1000;
                        currentLevel++;
                        levelProgress = 0;
                        updateLevelUI();
                        document.getElementById('boss-ui').style.display = 'none';
                    }
                    continue;
                }

                // מחיקה כשהכדור יוצא מהמסך (מונע עומס)
                if (b.position.z < cannonGroup.position.z - 160) {
                    scene.remove(b);
                    bullets.splice(i, 1);
                }
            }
        }

        // --- 9. בקרת מקלדת ותנועה ---
        const keys = {};
        let lastShootTime = 0;

        window.addEventListener('keydown', (e) => keys[e.code] = true);
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        function handleInput(now) {
            if (keys['ArrowLeft'] || keys['KeyA']) {
                if (cannonGroup.position.x > -8.5) cannonGroup.position.x -= 0.3;
            }
            if (keys['ArrowRight'] || keys['KeyD']) {
                if (cannonGroup.position.x < 8.5) cannonGroup.position.x += 0.3;
            }
            if (keys['Space']) {
                if (now - lastShootTime > 150) { // קצב ירייה (150 מ"ש)
                    spawnBullet(cannonGroup.position.x - 0.4, cannonGroup.position.z);
                    spawnBullet(cannonGroup.position.x + 0.4, cannonGroup.position.z);
                    lastShootTime = now;
                }
            }
        }

        // --- 10. לולאת הרינדור הראשית ---
        const clock = new THREE.Clock();
        let spawnTimer = 0;

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const now = performance.now();

            handleInput(now);
            updateBullets(delta);

            // תנועת אויבים לכיוון השחקן
            for (let i = lizards.length - 1; i >= 0; i--) {
                const liz = lizards[i];
                liz.position.z += (15 + currentLevel * 2) * delta;
                if (liz.position.z > 5) {
                    scene.remove(liz);
                    lizards.splice(i, 1);
                }
            }

            // יצירת אויבים תקופתית
            spawnTimer += delta;
            if (spawnTimer > Math.max(0.4, 1.5 - currentLevel * 0.1)) {
                spawnLizard();
                spawnTimer = 0;
            }

            // תנועת בוס קלה מצד לצד
            if (activeBoss) {
                activeBoss.position.x = Math.sin(now * 0.002) * 6;
                activeBoss.rotation.y += delta;
            }

            // רעידת מצלמה (Camera Shake)
            if (cameraShakeTime > 0) {
                cameraShakeTime -= delta;
                camera.position.x = (Math.random() - 0.5) * 0.4;
                camera.position.y = 4 + (Math.random() - 0.5) * 0.4;
            } else {
                camera.position.x = cannonGroup.position.x * 0.3; // מעקב רך אחרי התותח
                camera.position.y = 4;
            }

            renderer.render(scene, camera);
        }

        // התאמה לשינוי גודל החלון
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // התחלת המשחק
        animate();
    </script>
</body>
</html>
