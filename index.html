<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Spike Wheel Runner 3D - Forest Skyway</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #70c5ff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #mobile-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 480px;
            background-color: #70c5ff;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.3);
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        #ui {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            display: flex;
            justify-content: space-between;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            pointer-events: none;
            z-index: 10;
        }

        .hud-card {
            background: rgba(20, 50, 30, 0.75);
            padding: 8px 14px;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
        }

        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 35, 25, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: #fff;
            padding: 20px;
        }

        #start-screen h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #a8ff78;
            text-shadow: 0 0 10px #78ffd6;
            text-align: center;
            letter-spacing: 2px;
        }

        #start-screen p {
            font-size: 15px;
            color: #e0e0e0;
            margin-bottom: 30px;
            text-align: center;
        }

        .btn-start {
            padding: 16px 42px;
            font-size: 20px;
            font-weight: bold;
            color: #1a3c27;
            background: #a8ff78;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px #a8ff78;
            transition: transform 0.2s, background 0.2s;
        }

        .btn-start:active {
            transform: scale(0.95);
            background: #78ffd6;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="mobile-wrapper">
        <div id="start-screen">
            <h1>FOREST SKYWAY RUNNER</h1>
            <p>Drag left/right to steer • Double Tap to JUMP!</p>
            <button class="btn-start" id="start-btn">START RUN</button>
        </div>

        <div id="ui">
            <div class="hud-card" id="score">DISTANCE: 0m</div>
            <div class="hud-card" id="level">STAGE 1</div>
        </div>

        <div id="canvas-container"></div>
    </div>

    <script>
        let gameStarted = false;

        // --- 1. SETUP SCENE & SKY BACKGROUND ---
        const wrapper = document.getElementById('mobile-wrapper');
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        const skyColor = new THREE.Color(0x64b5f6); // שמיים כחולים נעימים
        scene.background = skyColor;
        scene.fog = new THREE.FogExp2(0x90caf9, 0.008); // ערפילאי אופק רך

        const camera = new THREE.PerspectiveCamera(65, wrapper.clientWidth / wrapper.clientHeight, 0.1, 1000);
        camera.position.set(0, 7.5, 13);
        camera.lookAt(0, 1, -20);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(wrapper.clientWidth, wrapper.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // --- 2. LIGHTING (SUNLIGHT) ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfffaed, 1.2); // אור שמש חם
        sunLight.position.set(20, 40, 10);
        scene.add(sunLight);

        // --- 3. TRACK & ENVIRONMENT (FOREST & CLOUDS) ---
        // טקסטורת מסלול
        const canvas = document.createElement('canvas');
        canvas.width = 256; canvas.height = 256;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#2c3e50'; ctx.fillRect(0, 0, 256, 256);
        ctx.strokeStyle = '#00e676'; ctx.lineWidth = 6;
        ctx.strokeRect(0, 0, 256, 256);

        const gridTexture = new THREE.CanvasTexture(canvas);
        gridTexture.wrapS = THREE.RepeatWrapping; gridTexture.wrapT = THREE.RepeatWrapping;
        gridTexture.repeat.set(4, 40);

        // מסלול הגשר
        const trackGeo = new THREE.PlaneGeometry(14, 300);
        const trackMat = new THREE.MeshStandardMaterial({ map: gridTexture, roughness: 0.4, metalness: 0.2 });
        const track = new THREE.Mesh(trackGeo, trackMat);
        track.rotation.x = -Math.PI / 2;
        track.position.z = -140;
        scene.add(track);

        const edgeGeo = new THREE.BoxGeometry(0.4, 0.4, 300);
        const edgeMat = new THREE.MeshStandardMaterial({ color: 0x00e676 });
        const leftEdge = new THREE.Mesh(edgeGeo, edgeMat);
        leftEdge.position.set(-7, 0.2, -140);
        const rightEdge = new THREE.Mesh(edgeGeo, edgeMat);
        rightEdge.position.set(7, 0.2, -140);
        scene.add(leftEdge, rightEdge);

        // קרקע היער למטה
        const forestGroundGeo = new THREE.PlaneGeometry(400, 400);
        const forestGroundMat = new THREE.MeshStandardMaterial({ color: 0x2e7d32, roughness: 0.9 });
        const forestGround = new THREE.Mesh(forestGroundGeo, forestGroundMat);
        forestGround.rotation.x = -Math.PI / 2;
        forestGround.position.set(0, -12, -100);
        scene.add(forestGround);

        // עננים ברקע
        const cloudsGroup = new THREE.Group();
        const cloudMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 });
        const cloudGeo = new THREE.DodecahedronGeometry(4, 1);

        for (let i = 0; i < 25; i++) {
            const cloud = new THREE.Mesh(cloudGeo, cloudMat);
            cloud.position.set(
                (Math.random() - 0.5) * 250,
                15 + Math.random() * 25,
                -Math.random() * 250
            );
            cloud.scale.set(1 + Math.random() * 2, 0.6 + Math.random() * 0.4, 1 + Math.random() * 1.5);
            cloudsGroup.add(cloud);
        }
        scene.add(cloudsGroup);

        // עצים ביער
        const treesGroup = new THREE.Group();
        const trunkGeo = new THREE.CylinderGeometry(0.4, 0.6, 3, 8);
        const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4e342e });
        const leavesGeo = new THREE.ConeGeometry(2.5, 6, 8);
        const leavesMat = new THREE.MeshStandardMaterial({ color: 0x1b5e20, roughness: 0.8 });

        function createTree() {
            const tree = new THREE.Group();
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.y = 1.5;
            const leaves = new THREE.Mesh(leavesGeo, leavesMat);
            leaves.position.y = 5.0;
            tree.add(trunk, leaves);
            return tree;
        }

        const trees = [];
        for (let i = 0; i < 60; i++) {
            const tree = createTree();
            const side = Math.random() > 0.5 ? 1 : -1;
            const x = side * (12 + Math.random() * 45);
            const z = -Math.random() * 280;
            tree.position.set(x, -12, z);
            const scale = 0.8 + Math.random() * 0.8;
            tree.scale.set(scale, scale, scale);
            treesGroup.add(tree);
            trees.push(tree);
        }
        scene.add(treesGroup);

        // --- 4. BUILD SPIKE WHEEL PLAYER ---
        const playerGroup = new THREE.Group();
        const wheelGroup = new THREE.Group();

        const wheelCenterGeo = new THREE.CylinderGeometry(1.2, 1.2, 1.2, 24);
        const wheelCenterMat = new THREE.MeshStandardMaterial({ color: 0x212121, metalness: 0.8, roughness: 0.2 });
        const wheelCenter = new THREE.Mesh(wheelCenterGeo, wheelCenterMat);
        wheelCenter.rotation.z = Math.PI / 2;
        wheelGroup.add(wheelCenter);

        const spikeContainer = new THREE.Group();
        wheelGroup.add(spikeContainer);

        function rebuildSpikes(countPerSide = 6) {
            while(spikeContainer.children.length > 0) {
                spikeContainer.remove(spikeContainer.children[0]);
            }

            const spikeGeo = new THREE.ConeGeometry(0.18, 0.65, 12);
            const spikeMat = new THREE.MeshStandardMaterial({ color: 0xff1744, emissive: 0x880015, metalness: 0.6 });

            const sides = [
                { offset: -0.65, rotZ: Math.PI / 2 },
                { offset: 0.65, rotZ: -Math.PI / 2 }
            ];

            sides.forEach(side => {
                for (let i = 0; i < countPerSide; i++) {
                    const angle = (i / countPerSide) * Math.PI * 2;
                    const spike = new THREE.Mesh(spikeGeo, spikeMat);
                    
                    spike.position.set(
                        side.offset,
                        Math.cos(angle) * 0.9,
                        Math.sin(angle) * 0.9
                    );
                    
                    spike.rotation.z = side.rotZ;
                    spike.rotation.x = -angle;

                    spikeContainer.add(spike);
                }
            });
        }

        rebuildSpikes(6);

        playerGroup.add(wheelGroup);
        playerGroup.position.set(0, 1.4, 2);
        scene.add(playerGroup);

        // --- 5. DEMO PORTAL ---
        function createPortal() {
            const portalGroup = new THREE.Group();
            const ringGeo = new THREE.TorusGeometry(2.5, 0.15, 16, 32);
            const ringMat = new THREE.MeshStandardMaterial({ color: 0x00e676, emissive: 0x00a352 });
            const ringMesh = new THREE.Mesh(ringGeo, ringMat);
            ringMesh.name = "portalRing";
            portalGroup.add(ringMesh);

            const innerGeo = new THREE.CircleGeometry(2.4, 32);
            const innerMat = new THREE.MeshBasicMaterial({ color: 0x69f0ae, transparent: true, opacity: 0.4, side: THREE.DoubleSide });
            portalGroup.add(new THREE.Mesh(innerGeo, innerMat));

            portalGroup.position.set(0, 2.5, -80);
            return portalGroup;
        }

        const activePortal = createPortal();
        scene.add(activePortal);

        // --- 6. CONTROLS & JUMP PHYSICS ---
        let targetX = 0;
        let distanceCovered = 0;

        let isJumping = false;
        let jumpVelocity = 0;
        const gravity = -0.018;
        const groundY = 1.4;

        let lastTapTime = 0;

        function triggerJump() {
            if (!isJumping) {
                isJumping = true;
                jumpVelocity = 0.38;
            }
        }

        function handlePointerMove(e) {
            if (!gameStarted) return;
            const rect = wrapper.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const relativeX = clientX - rect.left;
            const normalizedX = (relativeX / rect.width) * 2 - 1;
            targetX = Math.max(-4.2, Math.min(4.2, normalizedX * 5.0));
        }

        function handleTapStart(e) {
            if (!gameStarted) return;
            const currentTime = new Date().getTime();
            const tapLength = currentTime - lastTapTime;

            if (tapLength < 300 && tapLength > 0) {
                triggerJump();
            }
            lastTapTime = currentTime;
        }

        wrapper.addEventListener('pointermove', handlePointerMove);
        wrapper.addEventListener('touchmove', handlePointerMove, { passive: true });
        wrapper.addEventListener('pointerdown', handleTapStart);

        // FULLSCREEN API + START GAME
        document.getElementById('start-btn').addEventListener('click', () => {
            gameStarted = true;
            document.getElementById('start-screen').style.display = 'none';

            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen().catch(err => console.log(err));
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) {
                elem.msRequestFullscreen();
            }
        });

        // --- 7. MAIN GAME LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            if (!gameStarted) {
                renderer.render(scene, camera);
                return;
            }

            const prevX = playerGroup.position.x;
            playerGroup.position.x += (targetX - playerGroup.position.x) * 0.18;
            const velocityX = playerGroup.position.x - prevX;

            playerGroup.rotation.z = -velocityX * 1.2;
            playerGroup.rotation.y = -velocityX * 0.4;

            if (isJumping) {
                playerGroup.position.y += jumpVelocity;
                jumpVelocity += gravity;

                if (playerGroup.position.y <= groundY) {
                    playerGroup.position.y = groundY;
                    isJumping = false;
                    jumpVelocity = 0;
                }
            }

            wheelGroup.rotation.x -= 0.18;

            // תנועת מסלול, עצים ועננים (אפקט נסיעה)
            gridTexture.offset.y -= 0.02;
            distanceCovered += 0.4;
            document.getElementById('score').innerText = `DISTANCE: ${Math.floor(distanceCovered)}m`;

            // תנועת העצים לאחור
            trees.forEach(tree => {
                tree.position.z += 0.5;
                if (tree.position.z > 20) {
                    tree.position.z = -260;
                }
            });

            // תנועת עננים איטית
            cloudsGroup.children.forEach(cloud => {
                cloud.position.z += 0.08;
                if (cloud.position.z > 30) {
                    cloud.position.z = -220;
                }
            });

            // התנהגות פורטל
            activePortal.position.z += 0.4;
            const ring = activePortal.getObjectByName("portalRing");
            if (ring) ring.rotation.z += 0.03;

            if (activePortal.position.z > 10) {
                activePortal.position.z = -120;
                activePortal.position.x = (Math.random() - 0.5) * 8.0;
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = wrapper.clientWidth / wrapper.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(wrapper.clientWidth, wrapper.clientHeight);
        });

        animate();
    </script>
</body>
</html>
