<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cannon Crowd Clash 2D</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Splash Screen -->
    <div id="splash-screen">
        <div class="splash-content">
            <img src="assets/splash.png" alt="Cannon Clash Logo" class="splash-img" onerror="this.style.display='none'; document.getElementById('fallback-icon').style.display='block';">
            <div id="fallback-icon" class="splash-icon" style="display:none;">🚀</div>
            <h1 class="splash-title">CANNON CLASH</h1>
            <p class="splash-subtitle">Tap anywhere to start</p>
        </div>
    </div>

    <!-- In-Game UI -->
    <div id="game-ui" class="hidden">
        <div class="top-nav">
            <div class="score-container">
                <span class="icon">🏆</span>
                <span id="score-val">0</span>
            </div>
            <div class="coins-container">
                <span class="icon">🪙</span>
                <span id="coins-val">0</span>
            </div>
        </div>

        <div class="level-bar-container">
            <span id="level-text">LEVEL 1</span>
            <div class="level-progress-bg">
                <div id="level-progress-fill"></div>
            </div>
        </div>

        <div class="hp-bar-container">
            <div id="hp-bar"></div>
            <span id="hp-text">1000 / 1000</span>
        </div>
    </div>

    <!-- Main Menu & Shop -->
    <div id="start-menu" class="full-screen-menu">
        <header class="menu-header">
            <div class="app-title">
                <h1>CANNON CLASH 2D</h1>
                <p>Upgrade your cannon & conquer maps!</p>
            </div>
            <div class="player-stats">
                <div class="stat-badge">🪙 <span id="start-coins">0</span></div>
                <div class="stat-badge">🏆 <span id="start-best-score">0</span></div>
            </div>
        </header>

        <nav class="shop-tabs">
            <button id="tab-play-btn" class="tab-btn active">🎮 Play</button>
            <button id="tab-shop-btn" class="tab-btn">⚡ Upgrades</button>
            <button id="tab-maps-btn" class="tab-btn">🗺️ Maps</button>
        </nav>

        <div class="tabs-content">
            
            <div id="tab-play" class="tab-content active-content">
                <button id="start-btn" class="big-action-btn">START GAME</button>
            </div>

            <div id="tab-shop" class="tab-content hidden">
                <div class="shop-cards-grid">
                    
                    <div class="shop-card">
                        <div class="card-icon">⚡</div>
                        <div class="card-info">
                            <h3>Fire Rate</h3>
                            <span id="fire-rate-lvl" class="lvl-tag">LVL: 1</span>
                        </div>
                        <button id="buy-fire-rate-btn" class="buy-btn">
                            🪙 <span id="fire-rate-cost">100</span>
                        </button>
                    </div>

                    <div class="shop-card">
                        <div class="card-icon">💥</div>
                        <div class="card-info">
                            <h3>Fire Power</h3>
                            <span id="fire-power-lvl" class="lvl-tag">LVL: 1</span>
                        </div>
                        <button id="buy-fire-power-btn" class="buy-btn">
                            🪙 <span id="fire-power-cost">150</span>
                        </button>
                    </div>

                    <div class="shop-card">
                        <div class="card-icon">🧲</div>
                        <div class="card-info">
                            <h3>Coin Magnet</h3>
                            <span id="magnet-lvl" class="lvl-tag">LVL: 0</span>
                        </div>
                        <button id="buy-magnet-btn" class="buy-btn">
                            🪙 <span id="magnet-cost">200</span>
                        </button>
                    </div>

                    <div class="shop-card">
                        <div class="card-icon">🔱</div>
                        <div class="card-info">
                            <h3>Triple Shot</h3>
                            <span id="multishot-status" class="lvl-tag">LOCKED</span>
                        </div>
                        <button id="buy-multishot-btn" class="buy-btn">
                            🪙 <span>500</span>
                        </button>
                    </div>

                </div>
            </div>

            <div id="tab-maps" class="tab-content hidden">
                <div class="maps-grid">
                    
                    <div class="map-card selected" id="map-card-day">
                        <div class="map-preview map-day-bg"></div>
                        <h4>Bright Day</h4>
                        <button id="select-map-day" class="map-btn selected-btn">SELECTED</button>
                    </div>

                    <div class="map-card" id="map-card-sunset">
                        <div class="map-preview map-sunset-bg"></div>
                        <h4>Purple Sunset</h4>
                        <button id="select-map-sunset" class="map-btn">🪙 500</button>
                    </div>

                    <div class="map-card" id="map-card-space">
                        <div class="map-preview map-space-bg"></div>
                        <h4>Deep Space</h4>
                        <button id="select-map-space" class="map-btn">🪙 1500</button>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <!-- Game Over Menu -->
    <div id="game-over-menu" class="full-screen-menu hidden">
        <h2 class="game-over-title">GAME OVER!</h2>
        <button id="restart-btn" class="big-action-btn">TRY AGAIN</button>
    </div>

    <script src="main.js"></script>
</body>
</html>
