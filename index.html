<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Track Shooter 3D - Space Edition</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #030712;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none;
            touch-action: none;
        }
        #ui-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
            display: flex; flex-direction: column; justify-content: space-between; padding: 15px;
        }
        .top-ui { display: flex; justify-content: space-between; align-items: flex-start; }
        .stats-box { color: #fff; text-shadow: 0 0 8px #38bdf8; font-weight: bold; font-size: 16px; text-align: right; }
        
        /* HP Bar */
        #hp-container { width: 140px; background: rgba(0,0,0,0.6); border: 2px solid #1e293b; border-radius: 10px; padding: 3px; }
        #hp-bar { height: 12px; background: #22c55e; width: 100%; border-radius: 6px; transition: width 0.2s, background-color 0.2s; }
        #hp-text { color: #fff; font-size: 11px; text-align: center; margin-top: 2px; font-weight: bold; }

        /* Level Progress Bar */
        #level-progress-bg { width: 120px; height: 8px; background: rgba(255,255,255,0.15); border-radius: 4px; margin: 4px auto 0 auto; overflow: hidden; }
        #level-progress-fill { height: 100%; width: 0%; background: #38bdf8; transition: width 0.2s; }
        #level-text { color: #38bdf8; font-weight: bold; text-align: center; font-size: 13px; text-shadow: 0 0 6px rgba(56, 189, 248, 0.6); }

        .btn {
            background: linear-gradient(135deg, #0284c7, #0369a1); color: white; border: none; padding: 10px 20px;
            border-radius: 10px; font-weight: bold; cursor: pointer; pointer-events: auto;
            box-shadow: 0 0 12px rgba(2, 132, 199, 0.5); transition: transform 0.1s, background 0.2s;
        }
        .btn:active { transform: scale(0.95); }

        /* Color Picker UI */
        .color-picker-title { font-size: 14px; color: #cbd5e1; margin-bottom: 8px; }
        .color-options { display: flex; gap: 12px; justify-content: center; margin-bottom: 20px; pointer-events: auto; }
        .color-dot {
            width: 36px; height: 36px; border-radius: 50%; border: 3px solid #ffffff;
            cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 0 8px rgba(0,0,0,0.5);
        }
        .color-dot:hover, .color-dot.active { transform: scale(1.25); box-shadow: 0 0 15px #fff; }

        /* Modals & Overlays */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 7, 18, 0.88); backdrop-filter: blur(8px); z-index: 20;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: #fff; text-align: center; transition: opacity 0.3s;
        }
        .hidden { display: none !important; }
        .overlay h1 { font-size: 34px; color: #38bdf8; margin-bottom: 10px; text-shadow: 0 0 15px rgba(56, 189, 248, 0.8); }
        .overlay p { color: #94a3b8; margin-bottom: 15px; font-size: 16px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- UI Overlay -->
    <div id="ui-container">
        <div class="top-ui">
            <div>
                <div id="hp-container"><div id="hp-bar"></div></div>
                <div id="hp-text">500 / 500</div>
            </div>
            
            <div style="text-align: center;">
                <div id="level-text">LEVEL 1</div>
                <div id="level-progress-bg"><div id="level-progress-fill"></div></div>
            </div>

            <div class="stats-box">
                <div>SCORE: <span id="score-val">0</span></div>
                <button id="pause-btn" class="btn" style="margin-top: 5px; padding: 5px 12px; font-size: 12px;">PAUSE</button>
            </div>
        </div>
    </div>

    <!-- Start Overlay -->
    <div id="start-overlay" class="overlay">
        <h1>TRACK SHOOTER 3D</h1>
        <p>BEST SCORE: <span id="start-best-score">0</span></p>
        
        <div class="color-picker-title">SELECT CANNON COLOR:</div>
        <div class="color-options">
            <div class="color-dot active" style="background: #2563eb;" onclick="selectColor(0x2563eb, this)"></div>
            <div class="color-dot" style="background: #22c55e;" onclick="selectColor(0x22c55e, this)"></div>
            <div class="color-dot" style="background: #a855f7;" onclick="selectColor(0xa855f7, this)"></div>
            <div class="color-dot" style="background: #ef4444;" onclick="selectColor(0xef4444, this)"></div>
            <div class="color-dot" style="background: #f59e0b;" onclick="selectColor(0xf59e0b, this)"></div>
        </div>

        <button id="start-btn" class="btn" style="font-size: 20px; padding: 14px 40px;">START GAME</button>
    </div>

    <!-- Pause Menu -->
    <div id="pause-menu" class="overlay hidden">
        <h1>GAME PAUSED</h1>
        <button id="resume-btn" class="btn" style="font-size: 18px; padding: 12px 30px;">RESUME</button>
    </div>

    <!-- Game Over Modal -->
    <div id="game-over-modal" class="overlay hidden">
        <h1 style="color: #ef4444; text-shadow: 0 0 15px rgba(239, 68, 68, 0.8);">GAME OVER</h1>
        <p>FINAL SCORE: <span id="final-score-val">0</span></p>
        <p>BEST SCORE: <span id="best-score-val">0</span></p>
        <button id="restart-btn" class="btn" style="font-size: 18px; padding: 12px 30px;">PLAY AGAIN</button>
    </div>

    <script>
    let changeCannonColorFn = null;

    function selectColor(hexColor, element) {
        document.querySelectorAll('.color-dot').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
        if (changeCannonColorFn) changeCannonColorFn(hexColor);
    }

    window.addEventListener('DOMContentLoaded', () => {

        document.documentElement.style.touchAction = 'none';
        document.body.style.touchAction = 'none';
        
        const uiContainer = document.getElementById('ui-container');
        if (uiContainer) {
            uiContainer.style.pointerEvents = 'none';
            document.getElementById('pause-btn').style.pointerEvents = 'auto';
        }

        function requestFullScreen() {
            const docEl = document.documentElement;
            if (docEl.requestFullscreen) docEl.requestFullscreen().catch(() => {});
            else if (docEl.webkitRequestFullscreen) docEl.webkitRequestFullscreen();
        }

        // --- Audio Engine ---
        let audioCtx = null, masterGainNode = null, masterVolume = 0.25;

        function initAudio() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    masterGainNode = audioCtx.createGain();
                    masterGainNode.gain.value = masterVolume;
                    masterGainNode.connect(audioCtx.destination);
                } else if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            } catch (e) {}
        }

        function playSound(type) {
            if (!audioCtx || isPaused || masterVolume <= 0) return;
            try {
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.connect(gain);
                gain.connect(masterGainNode);

                if (type === 'shoot') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(700, now);
                    osc.frequency.exponentialRampToValueAtTime(120, now + 0.08);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now); osc.stop(now + 0.08);
                } else if (type === 'hit') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(160, now);
                    osc.frequency.exponentialRampToValueAtTime(40, now + 0.1);
                    gain.gain.setValueAtTime(0.4, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now); osc.stop(now + 0.1);
                }
            } catch(e) {}
        }

        // --- Game State & HighScore ---
        let currentLevel = 1, levelProgress = 0, maxLevelProgress = 100;
        let isBossActive = false, activeBoss = null;
        let highScore = localStorage.getItem('cannon_high_score') || 0;

        document.getElementById('start-best-score').innerText = highScore;

        function updateLevelUI() {
            const progressFill = document.getElementById('level-progress-fill');
            const levelText = document.getElementById('level-text');
            
            if (progressFill) {
                const percentage = isBossActive ? 100 : Math.min(100, (levelProgress / maxLevelProgress) * 100);
                progressFill.style.width = `${percentage}%`;
            }
            if (levelText) {
                levelText.innerText = isBossActive ? `LEVEL ${currentLevel} - BOSS!` : `LEVEL ${currentLevel}`;
            }
        }

        // --- Scene & Graphics ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030712, 0.007);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1500);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.4;

        renderer.domElement.style.touchAction = 'none';
        document.body.appendChild(renderer.domElement);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const ambientLight = new THREE.AmbientLight(0x1e1b4b, 1.2); scene.add(ambientLight);
        const mainLight = new THREE.DirectionalLight(0x38bdf8, 2.2); mainLight.position.set(15, 40, 20); scene.add(mainLight);
        const rimLight = new THREE.DirectionalLight(0xc084fc, 2.8); rimLight.position.set(-15, 20, -30); scene.add(rimLight);

        let cameraShakeIntensity = 0, cannonRecoilZ = 0;
        function triggerCameraShake(intensity) { cameraShakeIntensity = Math.max(cameraShakeIntensity, intensity); }

        // Skybox
        function createGalaxyTexture() {
            const canvas = document.createElement('canvas'); canvas.width = 2048; canvas.height = 2048;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#020208'; ctx.fillRect(0, 0, 2048, 2048);

            const nebulae = [
                { x: 500,  y: 600,  r: 800, color: 'rgba(99, 102, 241, 0.65)' },
                { x: 1500, y: 500,  r: 950, color: 'rgba(168, 85, 247, 0.70)' },
                { x: 1000, y: 1400, r: 750, color: 'rgba(236, 72, 153, 0.50)' }
            ];

            nebulae.forEach(n => {
                const grad = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
                grad.addColorStop(0, n.color);
                grad.addColorStop(0.5, n.color.replace(/[\d\.]+\)$/, '0.25)'));
                grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = grad; ctx.fillRect(0, 0, 2048, 2048);
            });
            return new THREE.CanvasTexture(canvas);
        }

        const galaxySky = new THREE.Mesh(
            new THREE.SphereGeometry(800, 32, 32),
            new THREE.MeshBasicMaterial({ map: createGalaxyTexture(), side: THREE.BackSide })
        );
        scene.add(galaxySky);

        // --- 🪐 DYNAMIC BACKGROUND OBJECTS (Planets, Moon & Asteroids) ---
        const bgObjectsGroup = new THREE.Group();

        // 1. Giant Ringed Planet (Saturn-like)
        const planetGeo = new THREE.SphereGeometry(45, 32, 32);
        const planetMat = new THREE.MeshStandardMaterial({ color: 0x4f46e5, roughness: 0.6, metalness: 0.2, emissive: 0x1e1b4b, emissiveIntensity: 0.4 });
        const ringedPlanet = new THREE.Mesh(planetGeo, planetMat);
        ringedPlanet.position.set(-180, 70, -350);

        const ringGeo = new THREE.RingGeometry(55, 85, 64);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x818cf8, side: THREE.DoubleSide, transparent: true, opacity: 0.55 });
        const planetRing = new THREE.Mesh(ringGeo, ringMat);
        planetRing.rotation.x = Math.PI / 2.4;
        ringedPlanet.add(planetRing);
        bgObjectsGroup.add(ringedPlanet);

        // 2. Glowing Red/Purple Moon
        const moonGeo = new THREE.SphereGeometry(22, 24, 24);
        const moonMat = new THREE.MeshStandardMaterial({ color: 0xdb2777, roughness: 0.8, emissive: 0x831843, emissiveIntensity: 0.5 });
        const moon = new THREE.Mesh(moonGeo, moonMat);
        moon.position.set(220, 110, -450);
        bgObjectsGroup.add(moon);

        // 3. Floating Asteroids
        const asteroids = [];
        const asteroidMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.9, metalness: 0.1 });

        for (let i = 0; i < 18; i++) {
            const size = Math.random() * 4 + 2;
            const astGeo = new THREE.DodecahedronGeometry(size, 1);
            
            // Randomize vertices for jagged rocky shape
            const posAttr = astGeo.attributes.position;
            for (let j = 0; j < posAttr.count; j++) {
                posAttr.setXYZ(
                    j,
                    posAttr.getX(j) + (Math.random() - 0.5) * (size * 0.3),
                    posAttr.getY(j) + (Math.random() - 0.5) * (size * 0.3),
                    posAttr.getZ(j) + (Math.random() - 0.5) * (size * 0.3)
                );
            }
            astGeo.computeVertexNormals();

            const ast = new THREE.Mesh(astGeo, asteroidMat);
            const side = i % 2 === 0 ? 1 : -1;
            ast.position.set(
                side * (Math.random() * 60 + 35),
                (Math.random() - 0.2) * 40,
                -Math.random() * 400 - 50
            );

            ast.userData = {
                rotSpeedX: (Math.random() - 0.5) * 0.8,
                rotSpeedY: (Math.random() - 0.5) * 0.8,
                speedZ: Math.random() * 10 + 5
            };

            bgObjectsGroup.add(ast);
            asteroids.push(ast);
        }

        scene.add(bgObjectsGroup);

        function updateBackgroundObjects(delta) {
            ringedPlanet.rotation.y += delta * 0.05;
            moon.rotation.y -= delta * 0.03;

            asteroids.forEach(ast => {
                ast.rotation.x += ast.userData.rotSpeedX * delta;
                ast.rotation.y += ast.userData.rotSpeedY * delta;
                ast.position.z += ast.userData.speedZ * delta;

                if (ast.position.z > 20) {
                    ast.position.z = -450;
                }
            });
        }

        // Track
        const trackWidth = 18, maxBoundX = trackWidth / 2 - 1.2, trackLength = 2000;
        const track = new THREE.Mesh(
            new THREE.BoxGeometry(trackWidth, 0.5, trackLength),
            new THREE.MeshStandardMaterial({ color: 0x070d1e, roughness: 0.1, metalness: 0.9, emissive: 0x0284c7, emissiveIntensity: 0.08 })
        );
        track.position.set(0, -0.25, -trackLength / 2 + 10);
        scene.add(track);

        const railGeo = new THREE.BoxGeometry(0.3, 0.6, trackLength);
        const railMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
        const railL = new THREE.Mesh(railGeo, railMat); railL.position.set(-trackWidth / 2, 0.1, -trackLength / 2 + 10);
        const railR = new THREE.Mesh(railGeo, railMat); railR.position.set(trackWidth / 2, 0.1, -trackLength / 2 + 10);
        scene.add(railL, railR);

        // Particle System
        const particles = [];
        const particleGeo = new THREE.SphereGeometry(0.12, 6, 6);

        function createExplosion(position, colorHex = 0xef4444) {
            const count = 16;
            const pMat = new THREE.MeshBasicMaterial({ color: colorHex });
            for (let i = 0; i < count; i++) {
                const p = new THREE.Mesh(particleGeo, pMat);
                p.position.copy(position);
                p.userData = {
                    vel: new THREE.Vector3(
                        (Math.random() - 0.5) * 14,
                        Math.random() * 10 + 2,
                        (Math.random() - 0.5) * 14
                    ),
                    life: 0.45
                };
                scene.add(p);
                particles.push(p);
            }
        }

        function updateParticles(delta) {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.userData.life -= delta;
                p.position.addScaledVector(p.userData.vel, delta);
                p.scale.multiplyScalar(0.92);

                if (p.userData.life <= 0) {
                    scene.remove(p);
                    particles.splice(i, 1);
                }
            }
        }

        // Starfield
        function createRoundStarTexture() {
            const canvas = document.createElement('canvas'); canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
            grad.addColorStop(0.35, 'rgba(56, 189, 248, 0.85)');
            grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(32, 32, 32, 0, Math.PI * 2); ctx.fill();
            return new THREE.CanvasTexture(canvas);
        }

        const starCount = 700;
        const starGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(starCount * 3);
        const starSpeeds = new Float32Array(starCount);

        for (let i = 0; i < starCount; i++) {
            starPos[i * 3]     = (Math.random() - 0.5) * 70;
            starPos[i * 3 + 1] = Math.random() * 35 - 3;
            starPos[i * 3 + 2] = -Math.random() * 250;
            starSpeeds[i]      = 40 + Math.random() * 50;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));

        const starField = new THREE.Points(starGeo, new THREE.PointsMaterial({
            size: 1.8, map: createRoundStarTexture(), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
        }));
        scene.add(starField);

        function updateStars(delta) {
            const positions = starField.geometry.attributes.position.array;
            for (let i = 0; i < starCount; i++) {
                positions[i * 3 + 2] += starSpeeds[i] * delta;
                if (positions[i * 3 + 2] > 15) {
                    positions[i * 3 + 2] = -230;
                    positions[i * 3] = (Math.random() - 0.5) * 70;
                    positions[i * 3 + 1] = Math.random() * 35 - 3;
                }
            }
            starField.geometry.attributes.position.needsUpdate = true;
        }

        // HP Mechanics
        const maxHp = 500; let currentHp = 500;
        function updateHpBar() {
            const hpBar = document.getElementById('hp-bar');
            const hpText = document.getElementById('hp-text');
            if (!hpBar || !hpText) return;

            const percentage = Math.max(0, (currentHp / maxHp) * 100);
            hpBar.style.width = `${percentage}%`;
            hpText.innerText = `${Math.max(0, currentHp)} / ${maxHp}`;

            let colorHex = '#22c55e';
            if (percentage < 30) colorHex = '#ef4444';
            else if (percentage < 60) colorHex = '#eab308';
            hpBar.style.backgroundColor = colorHex;
        }

        // --- TALL RED DEMONS ---
        const demons = []; let demonSpawnTimer = 0;
        const DEMON_TYPES = {
            STANDARD: { bodyColor: 0xd97706, heightScale: 1.8, speed: 15.0, hp: 1, scoreVal: 30 },
            FAST:     { bodyColor: 0xef4444, heightScale: 2.1, speed: 23.0, hp: 1, scoreVal: 50 },
            ARMORED:  { bodyColor: 0x991b1b, heightScale: 2.6, speed: 9.0,  hp: 4, scoreVal: 100 }
        };

        function createDemonMesh(typeConfig) {
            const demonGroup = new THREE.Group();
            
            const demonMat = new THREE.MeshStandardMaterial({ color: typeConfig.bodyColor, roughness: 0.3, metalness: 0.3 });
            const darkMat = new THREE.MeshStandardMaterial({ color: 0x450a0a, roughness: 0.5 });
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
            const hornMat = new THREE.MeshStandardMaterial({ color: 0xfacc15, metalness: 0.8, roughness: 0.2 });

            const torsoGeo = new THREE.CylinderGeometry(0.7, 0.4, 3.2, 10);
            const torso = new THREE.Mesh(torsoGeo, demonMat);
            torso.position.y = 1.6;
            demonGroup.add(torso);

            const headGeo = new THREE.BoxGeometry(0.9, 1.0, 0.9);
            const head = new THREE.Mesh(headGeo, demonMat);
            head.position.set(0, 3.4, 0);
            demonGroup.add(head);

            const eyeGeo = new THREE.SphereGeometry(0.15, 8, 8);
            const eyeL = new THREE.Mesh(eyeGeo, eyeMat); eyeL.position.set(-0.25, 3.5, 0.45);
            const eyeR = new THREE.Mesh(eyeGeo, eyeMat); eyeR.position.set(0.25, 3.5, 0.45);
            demonGroup.add(eyeL, eyeR);

            const hornGeo = new THREE.ConeGeometry(0.18, 1.2, 6);
            hornGeo.rotateX(-0.2);
            const hornL = new THREE.Mesh(hornGeo, hornMat); hornL.position.set(-0.35, 4.3, 0.1); hornL.rotation.z = 0.2;
            const hornR = new THREE.Mesh(hornGeo, hornMat); hornR.position.set(0.35, 4.3, 0.1); hornR.rotation.z = -0.2;
            demonGroup.add(hornL, hornR);

            const armGeo = new THREE.BoxGeometry(0.3, 2.2, 0.3);
            const armL = new THREE.Mesh(armGeo, darkMat); armL.position.set(-0.95, 2.0, 0); armL.rotation.z = 0.15;
            const armR = new THREE.Mesh(armGeo, darkMat); armR.position.set(0.95, 2.0, 0); armR.rotation.z = -0.15;
            demonGroup.add(armL, armR);

            demonGroup.scale.set(1.2, typeConfig.heightScale, 1.2);
            demonGroup.userData = { 
                hp: typeConfig.hp, 
                speed: typeConfig.speed, 
                scoreVal: typeConfig.scoreVal, 
                color: typeConfig.bodyColor 
            };
            return demonGroup;
        }

        function spawnDemon() {
            if (isBossActive) return;
            const rand = Math.random();
            let config = DEMON_TYPES.STANDARD;
            if (rand > 0.75) config = DEMON_TYPES.ARMORED;
            else if (rand > 0.5) config = DEMON_TYPES.FAST;

            const demon = createDemonMesh(config);
            demon.position.set((Math.random() - 0.5) * (trackWidth - 3), 0, cannonGroup.position.z - 120 - Math.random() * 30);
            scene.add(demon); demons.push(demon);
        }

        function spawnBoss() {
            isBossActive = true; updateLevelUI();
            const bossConfig = { bodyColor: 0x7f1d1d, heightScale: 3.5, speed: 4.5, hp: 40 + (currentLevel * 20), scoreVal: 1000 };
            activeBoss = createDemonMesh(bossConfig);
            activeBoss.scale.set(2.5, 3.5, 2.5);
            activeBoss.position.set(0, 0, cannonGroup.position.z - 110);
            activeBoss.userData.maxHp = bossConfig.hp;
            scene.add(activeBoss);
        }

        function updateDemons(delta) {
            if (!isBossActive) {
                demonSpawnTimer += delta;
                if (demonSpawnTimer >= 1.8) { demonSpawnTimer = 0; spawnDemon(); }
            }

            for (let i = demons.length - 1; i >= 0; i--) {
                const dem = demons[i];
                dem.position.z += dem.userData.speed * delta;

                if (dem.position.distanceTo(cannonGroup.position) < 2.5) {
                    currentHp -= 100; updateHpBar(); playSound('hit'); triggerCameraShake(0.35);
                    createExplosion(dem.position, dem.userData.color);
                    scene.remove(dem); demons.splice(i, 1);
                    if (currentHp <= 0) { gameOver(); return; }
                    continue;
                }
                if (dem.position.z > cannonGroup.position.z + 10) { scene.remove(dem); demons.splice(i, 1); }
            }

            if (isBossActive && activeBoss) {
                if (activeBoss.position.z < cannonGroup.position.z - 18) activeBoss.position.z += activeBoss.userData.speed * delta;
                if (activeBoss.position.distanceTo(cannonGroup.position) < 5.0) {
                    currentHp -= 200; updateHpBar(); playSound('hit'); triggerCameraShake(0.5);
                    if (currentHp <= 0) gameOver();
                }
            }
        }

        // Cannon & Dual Muzzle Flashes
        const cannonGroup = new THREE.Group();
        const cannonMeshGroup = new THREE.Group();

        const baseMat = new THREE.MeshStandardMaterial({ color: 0x2563eb, roughness: 0.15, metalness: 0.85 });
        const domeMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, roughness: 0.1, metalness: 0.9 });
        const barrelMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.2, metalness: 0.95 });

        changeCannonColorFn = function(hexColor) {
            baseMat.color.setHex(hexColor);
            flashLightL.color.setHex(hexColor);
            flashLightR.color.setHex(hexColor);
        };

        const base = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.5, 0.8, 24), baseMat); base.rotation.x = Math.PI / 12; cannonMeshGroup.add(base);
        const dome = new THREE.Mesh(new THREE.SphereGeometry(1.0, 24, 20, 0, Math.PI * 2, 0, Math.PI / 2), domeMat); dome.position.y = 0.3; cannonMeshGroup.add(dome);
        
        const barrelL = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.38, 2.0, 16), barrelMat); barrelL.rotation.x = Math.PI / 2; barrelL.position.set(-0.45, 0.35, -1.0); cannonMeshGroup.add(barrelL);
        const barrelR = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.38, 2.0, 16), barrelMat); barrelR.rotation.x = Math.PI / 2; barrelR.position.set(0.45, 0.35, -1.0); cannonMeshGroup.add(barrelR);

        const flashGeo = new THREE.SphereGeometry(0.4, 12, 12);
        const flashMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0 });

        const muzzleFlashL = new THREE.Mesh(flashGeo, flashMat); muzzleFlashL.position.set(-0.45, 0.35, -2.1); cannonMeshGroup.add(muzzleFlashL);
        const muzzleFlashR = new THREE.Mesh(flashGeo, flashMat); muzzleFlashR.position.set(0.45, 0.35, -2.1); cannonMeshGroup.add(muzzleFlashR);

        const flashLightL = new THREE.PointLight(0x38bdf8, 0, 8); flashLightL.position.set(-0.45, 0.35, -2.1); cannonMeshGroup.add(flashLightL);
        const flashLightR = new THREE.PointLight(0x38bdf8, 0, 8); flashLightR.position.set(0.45, 0.35, -2.1); cannonMeshGroup.add(flashLightR);

        cannonGroup.add(cannonMeshGroup); cannonGroup.position.set(0, 1.2, 0); scene.add(cannonGroup);

        // Bullets
        const bulletGeo = new THREE.SphereGeometry(0.35, 12, 12);
        const bulletMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
        const bullets = [];

        function triggerDualMuzzleFlash() {
            flashMat.opacity = 1.0;
            flashLightL.intensity = 5.0;
            flashLightR.intensity = 5.0;
        }

        function updateMuzzleFlashes(delta) {
            if (flashMat.opacity > 0) {
                flashMat.opacity = THREE.MathUtils.lerp(flashMat.opacity, 0, delta * 25);
                flashLightL.intensity = THREE.MathUtils.lerp(flashLightL.intensity, 0, delta * 25);
                flashLightR.intensity = THREE.MathUtils.lerp(flashLightR.intensity, 0, delta * 25);
            }
        }

        function spawnBullet(x, z) {
            const bullet = new THREE.Mesh(bulletGeo, bulletMat);
            bullet.scale.set(1, 1, 2.2); bullet.position.set(x, 1.1, z);
            scene.add(bullet); bullets.push(bullet);
        }

        function updateBullets(delta) {
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.position.z -= 95.0 * delta;

                let hitEnemy = false;
                for (let j = demons.length - 1; j >= 0; j--) {
                    const dem = demons[j];
                    if (b.position.distanceTo(dem.position) < 1.8) {
                        dem.userData.hp--;
                        createExplosion(b.position, 0x38bdf8);
                        if (dem.userData.hp <= 0) {
                            score += dem.userData.scoreVal;
                            levelProgress += 5;
                            document.getElementById('score-val').innerText = score;
                            updateLevelUI();
                            createExplosion(dem.position, dem.userData.color);
                            scene.remove(dem); demons.splice(j, 1);
                            if (levelProgress >= maxLevelProgress && !isBossActive) spawnBoss();
                        }
                        hitEnemy = true; playSound('hit'); break;
                    }
                }

                if (hitEnemy) { scene.remove(b); bullets.splice(i, 1); continue; }

                if (isBossActive && activeBoss && b.position.distanceTo(activeBoss.position) < 3.5) {
                    activeBoss.userData.hp--; playSound('hit'); triggerCameraShake(0.1);
                    createExplosion(b.position, 0xef4444);
                    scene.remove(b); bullets.splice(i, 1);

                    if (activeBoss.userData.hp <= 0) {
                        createExplosion(activeBoss.position, 0xf59e0b);
                        scene.remove(activeBoss); activeBoss = null; isBossActive = false;
                        score += 1000; currentLevel++; levelProgress = 0; updateLevelUI();
                    }
                    continue;
                }

                if (b.position.z < cannonGroup.position.z - 160) { scene.remove(b); bullets.splice(i, 1); }
            }
        }

        // Controls
        let targetX = 0, isDragging = false, isFiring = false, previousTouchX = 0;
        function stopInput() { isDragging = false; isFiring = false; }

        renderer.domElement.addEventListener('touchstart', (e) => { 
            e.preventDefault(); isDragging = true; isFiring = true; previousTouchX = e.touches[0].clientX; 
        }, { passive: false });
        renderer.domElement.addEventListener('touchend', (e) => { e.preventDefault(); stopInput(); }, { passive: false });
        renderer.domElement.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (isDragging && gameStarted && !isPaused) {
                targetX += (e.touches[0].clientX - previousTouchX) * 0.045;
                previousTouchX = e.touches[0].clientX;
            }
        }, { passive: false });

        renderer.domElement.addEventListener('mousedown', (e) => { isDragging = true; isFiring = true; previousTouchX = e.clientX; });
        renderer.domElement.addEventListener('mouseup', stopInput);
        renderer.domElement.addEventListener('mousemove', (e) => {
            if (isDragging && gameStarted && !isPaused) {
                targetX += (e.clientX - previousTouchX) * 0.045;
                previousTouchX = e.clientX;
            }
        });

        // Game Loop
        let gameStarted = false, isPaused = false, score = 0, shootTimer = 0;

        function resetGame() {
            score = 0; currentHp = maxHp; currentLevel = 1; levelProgress = 0;
            isBossActive = false; cameraShakeIntensity = 0; cannonRecoilZ = 0;
            
            if (activeBoss) { scene.remove(activeBoss); activeBoss = null; }
            for (let dem of demons) scene.remove(dem); demons.length = 0;
            for (let b of bullets) scene.remove(b); bullets.length = 0;
            for (let p of particles) scene.remove(p); particles.length = 0;

            cannonGroup.position.set(0, 1.2, 0); targetX = 0;
            document.getElementById('score-val').innerText = '0';
            updateHpBar(); updateLevelUI();
        }

        function gameOver() {
            gameStarted = false; stopInput();
            if (score > highScore) { highScore = score; localStorage.setItem('cannon_high_score', highScore); }
            document.getElementById('final-score-val').innerText = score;
            document.getElementById('best-score-val').innerText = highScore;
            document.getElementById('game-over-modal').classList.remove('hidden');
        }

        document.getElementById('restart-btn')?.addEventListener('click', () => {
            requestFullScreen(); document.getElementById('game-over-modal')?.classList.add('hidden');
            resetGame(); gameStarted = true;
        });

        document.getElementById('start-btn')?.addEventListener('click', () => {
            requestFullScreen(); initAudio(); resetGame(); gameStarted = true;
            const startOverlay = document.getElementById('start-overlay');
            startOverlay.style.opacity = '0'; setTimeout(() => startOverlay.classList.add('hidden'), 300);
        });

        document.getElementById('pause-btn')?.addEventListener('click', () => {
            if (!gameStarted) return; isPaused = true;
            document.getElementById('pause-menu')?.classList.remove('hidden');
        });

        document.getElementById('resume-btn')?.addEventListener('click', () => { 
            requestFullScreen(); isPaused = false; document.getElementById('pause-menu')?.classList.add('hidden'); 
        });

        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = Math.min(clock.getDelta(), 0.1);
            const elapsedTime = clock.getElapsedTime();

            updateStars(delta);
            updateParticles(delta);
            updateBackgroundObjects(delta);

            if (gameStarted && !isPaused) {
                targetX = Math.max(-maxBoundX, Math.min(maxBoundX, targetX));
                const prevX = cannonGroup.position.x;
                cannonGroup.position.x = THREE.MathUtils.lerp(cannonGroup.position.x, targetX, delta * 12);
                
                const moveDelta = cannonGroup.position.x - prevX;
                cannonMeshGroup.rotation.z = -moveDelta * 0.8;
                cannonMeshGroup.rotation.x = Math.sin(elapsedTime * 8) * 0.03;

                shootTimer += delta;
                if (isFiring && shootTimer >= 0.11) {
                    shootTimer = 0;
                    spawnBullet(cannonGroup.position.x - 0.45, cannonGroup.position.z - 1.2);
                    spawnBullet(cannonGroup.position.x + 0.45, cannonGroup.position.z - 1.2);
                    triggerDualMuzzleFlash();
                    playSound('shoot'); cannonRecoilZ = 0.2;
                }

                updateMuzzleFlashes(delta);

                cannonRecoilZ = THREE.MathUtils.lerp(cannonRecoilZ, 0, delta * 10);
                cannonMeshGroup.position.z = cannonRecoilZ;

                updateBullets(delta);
                updateDemons(delta);

                if (cameraShakeIntensity > 0) {
                    cameraShakeIntensity = THREE.MathUtils.lerp(cameraShakeIntensity, 0, delta * 8);
                    camera.position.x = cannonGroup.position.x + (Math.random() - 0.5) * cameraShakeIntensity;
                    camera.position.y = 8 + (Math.random() - 0.5) * cameraShakeIntensity;
                    camera.position.z = cannonGroup.position.z + 12 + (Math.random() - 0.5) * cameraShakeIntensity;
                } else {
                    camera.position.x = THREE.MathUtils.lerp(camera.position.x, cannonGroup.position.x, delta * 6);
                    camera.position.y = 8;
                    camera.position.z = cannonGroup.position.z + 12;
                }
                camera.lookAt(cannonGroup.position.x, 1.0, cannonGroup.position.z - 20);
            }

            renderer.render(scene, camera);
        }

        animate();
    });
    </script>
</body>
</html>
