<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cannon Clash</title>
    <link rel="stylesheet" href="style.css">
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="game-ui">
        <!-- Score Card -->
        <div id="score-card" class="hidden">
            <span>SCORE</span>
            <div id="score-val">0</div>
        </div>

        <!-- Pause Button -->
        <button id="pause-btn" class="hidden">❚❚</button>
    </div>

    <!-- Start Overlay -->
    <div id="start-overlay">
        <h1>CANNON CLASH</h1>
        <p>Choose Cannon Color</p>
        <div class="color-picker">
            <button class="color-btn active" data-color="0xdc2626" style="background: #dc2626;"></button>
            <button class="color-btn" data-color="0x2563eb" style="background: #2563eb;"></button>
            <button class="color-btn" data-color="0x16a34a" style="background: #16a34a;"></button>
            <button class="color-btn" data-color="0x9333ea" style="background: #9333ea;"></button>
        </div>
        <button id="start-btn">TAP TO PLAY</button>
    </div>

    <!-- Pause Menu Overlay -->
    <div id="pause-menu" class="hidden">
        <div class="menu-box">
            <h2>GAME PAUSED</h2>
            <div class="setting-item">
                <label for="volume-slider">Sound Volume 🔊</label>
                <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.25">
            </div>
            <button id="resume-btn">RESUME</button>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
