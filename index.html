<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ball Blast 3D</title>
    <link rel="stylesheet" href="style.css">
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- HUD במהלך המשחק -->
    <div id="ui-container">
        <!-- מד חיים -->
        <div id="hp-container">
            <div id="hp-bar"></div>
            <span id="hp-text">500 / 500</span>
        </div>

        <!-- מד שלב -->
        <div id="level-bar-container">
            <span id="level-text">LEVEL 1</span>
            <div class="progress-outer">
                <div id="level-progress-fill"></div>
            </div>
        </div>

        <!-- ניקוד -->
        <div id="score-card">
            <span class="score-label">SCORE</span>
            <span id="score-val">0</span>
        </div>

        <!-- כפתור Pause -->
        <button id="pause-btn" class="icon-btn">⏸</button>
    </div>

    <!-- 1. מסך פתיחה (Start Overlay) -->
    <div id="start-overlay">
        <div id="start-menu">
            <div class="header-section">
                <h1 class="game-title">BALL BLAST</h1>
                <p class="game-subtitle">Destroy the bouncing spheres and upgrade your firepower!</p>
            </div>

            <div class="best-badge">
                BEST SCORE: <span id="start-best-score">0</span>
            </div>

            <div class="action-section">
                <button id="start-btn" class="btn">START GAME</button>
            </div>
        </div>
    </div>

    <!-- 2. תפריט עצירה (Pause Menu) -->
    <div id="pause-menu" class="hidden">
        <div class="pause-card">
            <h2>GAME PAUSED</h2>

            <div class="customization-section">
                <span class="section-label">CANNON COLOR</span>
                <div class="color-picker">
                    <button class="color-btn active" style="background: #2563eb;" onclick="changeCannonColor(0x2563eb)"></button>
                    <button class="color-btn" style="background: #dc2626;" onclick="changeCannonColor(0xdc2626)"></button>
                    <button class="color-btn" style="background: #16a34a;" onclick="changeCannonColor(0x16a34a)"></button>
                    <button class="color-btn" style="background: #9333ea;" onclick="changeCannonColor(0x9333ea)"></button>
                </div>
            </div>

            <button id="resume-btn" class="btn">RESUME</button>
            <button id="restart-from-pause-btn" class="btn btn-restart" style="margin-top: 8px;">RESTART</button>
        </div>
    </div>

    <!-- 3. מסך סיום (Game Over Modal) -->
    <div id="game-over-modal" class="hidden">
        <div class="pause-card">
            <h2 style="color: #ef4444;">GAME OVER</h2>
            <p style="font-size: 1.1rem; margin: 10px 0;">SCORE: <strong id="final-score-val" style="color: #38bdf8;">0</strong></p>
            <p style="font-size: 0.9rem; color: #94a3b8; margin-bottom: 15px;">BEST: <span id="best-score-val">0</span></p>
            <button id="restart-btn" class="btn btn-restart">PLAY AGAIN</button>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
