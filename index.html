<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cyber Skyway 3D</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #000; user-select: none; }
        #ui { position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; pointer-events: none; }
        .hud-box { background: rgba(0, 20, 40, 0.7); border: 1px solid #00f3ff; color: #00f3ff; padding: 10px 20px; border-radius: 12px; font-weight: bold; font-size: 18px; box-shadow: 0 0 15px rgba(0,243,255,0.3); text-shadow: 0 0 5px #00f3ff; }
        #overlay { position: absolute; inset: 0; background: rgba(5, 5, 12, 0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; backdrop-filter: blur(5px); }
        h1 { color: #00f3ff; font-size: 42px; margin: 0 0 10px 0; text-shadow: 0 0 20px #00f3ff; letter-spacing: 2px; }
        button { background: linear-gradient(45deg, #ff0055, #ff5500); border: none; color: white; padding: 16px 45px; font-size: 22px; border-radius: 30px; cursor: pointer; margin-top: 20px; font-weight: bold; box-shadow: 0 0 20px rgba(255, 0, 85, 0.6); transition: transform 0.2s; }
        button:hover { transform: scale(1.05); }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui">
        <div class="hud-box" id="dist">DISTANCE: 0m</div>
        <div class="hud-box">STAGE 1: DEEP SPACE</div>
    </div>

    <div id="overlay">
        <h1>CYBER SKYWAY 3D</h1>
        <p style="color: #aaa;">גרור שמאלה/ימינה כדי לשלוט בדיסק</p>
        <button id="start">START RACE</button>
    </div>

    <script>
        // --- 1. סצנה ותאורת חלל ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050510, 0.003);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        // תאורה דרמטית (Sci-Fi)
        const ambientLight = new THREE.AmbientLight(0x111122, 1.5);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffaa44, 2.5);
        sunLight.position.set(100, 100, -50);
        scene.add(sunLight);

        const cyanLight = new THREE.PointLight(0x00f3ff, 3, 50);
        scene.add(cyanLight);

        // --- 2. רקע חלל (כוכבים ופלנטה) ---
        // כוכבים
        const starsGeo = new THREE.BufferGeometry();
        const starCount = 2000;
        const starPositions = new Float32Array(starCount * 3);
        for(let i=0; i<starCount*3; i++) {
            starPositions[i] = (Math.random() - 0.5) * 600;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.8 });
        const starField = new THREE.Points(starsGeo, starsMat);
        scene.add(starField);

        // פלנטה ברקע
        const planetGeo = new THREE.SphereGeometry(40, 32, 32);
        const planetMat = new THREE.MeshStandardMaterial({
            color: 0x0044ff,
            roughness: 0.8,
            emissive: 0x001133
        });
        const planet = new THREE.Mesh(planetGeo, planetMat);
        planet.position.set(-80, -20, 150);
        scene.add(planet);

        // --- 3. מסלול עתידני עם פסי ניאון ---
        const points = [];
        const numPoints = 250;
        for (let i = 0; i < numPoints; i++) {
            const z = i * 12;
            const x = Math.sin(i * 0.08) * 12 + Math.cos(i * 0.04) * 6;
            const y = Math.sin(i * 0.05) * 3;
            points.push(new THREE.Vector3(x, y, z));
        }
        const path = new THREE.CatmullRomCurve3(points);

        // גאומטריה של גוף המסלול
        const trackWidth = 8;
        const shape = new THREE.Shape();
        shape.moveTo(-trackWidth/2, -0.4);
        shape.lineTo(trackWidth/2, -0.4);
        shape.lineTo(trackWidth/2, 0.4);
        shape.lineTo(-trackWidth/2, 0.4);

        const trackGeo = new THREE.ExtrudeGeometry(shape, { steps: 500, extrudePath: path, bevelEnabled: false });
        const trackMat = new THREE.MeshStandardMaterial({ 
            color: 0x111525, 
            roughness: 0.2, 
            metalness: 0.8 
        });
        const trackMesh = new THREE.Mesh(trackGeo, trackMat);
        scene.add(trackMesh);

        // פסי ניאון זוהרים בצדדי המסלול
        const createGlowEdge = (offset) => {
            const edgePoints = points.map(p => p.clone().add(new THREE.Vector3(offset, 0.2, 0)));
            const edgePath = new THREE.CatmullRomCurve3(edgePoints);
            const edgeGeo = new THREE.TubeGeometry(edgePath, 400, 0.15, 8, false);
            const edgeMat = new THREE.MeshBasicMaterial({ color: 0x00f3ff });
            return new THREE.Mesh(edgeGeo, edgeMat);
        };
        scene.add(createGlowEdge(-trackWidth/2));
        scene.add(createGlowEdge(trackWidth/2));

        // --- 4. השחקן (Drone / Sci-Fi Wheel) ---
        const playerGroup = new THREE.Group();
        
        // גלגל מרכזי
        const wheelGeo = new THREE.CylinderGeometry(1.6, 1.6, 1.2, 32);
        wheelGeo.rotateZ(Math.PI / 2);
        const wheelMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.9, roughness: 0.1 });
        const wheel = new THREE.Mesh(wheelGeo, wheelMat);
        playerGroup.add(wheel);

        // ליבת ניאון זוהרת במרכז
        const coreGeo = new THREE.CylinderGeometry(1.2, 1.2, 1.25, 16);
        coreGeo.rotateZ(Math.PI / 2);
        const coreMat = new THREE.MeshBasicMaterial({ color: 0xff0055 });
        const core = new THREE.Mesh(coreGeo, coreMat);
        playerGroup.add(core);

        scene.add(playerGroup);

        // --- 5. שליטה ומכניקה ---
        let isRunning = false;
        let progress = 0;
        let playerOffsetX = 0;
        let targetOffsetX = 0;

        let startX = 0;
        window.addEventListener('pointerdown', e => startX = e.clientX);
        window.addEventListener('pointermove', e => {
            if (e.buttons === 1 || e.pointerType === 'touch') {
                const delta = (e.clientX - startX) * 0.02;
                targetOffsetX = Math.max(-trackWidth/2 + 1.2, Math.min(trackWidth/2 - 1.2, targetOffsetX + delta));
                startX = e.clientX;
            }
        });

        document.getElementById('start').onclick = () => {
            document.getElementById('overlay').style.display = 'none';
            isRunning = true;
        };

        // --- 6. לולאת אקשן ורנדור ---
        function animate() {
            requestAnimationFrame(animate);

            if (isRunning) {
                progress += 0.0007; // מהירות
                if (progress > 0.98) progress = 0;

                const pos = path.getPointAt(progress);
                const tangent = path.getTangentAt(progress).normalize();

                playerOffsetX += (targetOffsetX - playerOffsetX) * 0.1;
                const side = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();

                // מיקום השחקן
                playerGroup.position.copy(pos).addScaledVector(side, playerOffsetX);
                playerGroup.position.y += 1.6;

                // סיבוב השחקן
                wheel.rotation.x += 0.2;
                cyanLight.position.copy(playerGroup.position);

                // המצלמה עוקבת בצורה דינמית עם הטיה בסיבובים
                const camPos = pos.clone().sub(tangent.clone().multiplyScalar(10));
                camPos.y += 4.5;
                camera.position.copy(camPos);
                camera.lookAt(playerGroup.position.clone().add(new THREE.Vector3(0, 0.8, 6)));

                document.getElementById('dist').innerText = `DISTANCE: ${Math.floor(progress * 3500)}m`;
            }

            // סיבוב עדין של רקע החלל
            starField.rotation.y += 0.0002;

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
