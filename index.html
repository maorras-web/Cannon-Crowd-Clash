<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cannon Crowd Clash</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            overflow: hidden;
            background-color: #1a1a1a;
            color: #fff;
        }

        #game-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }

        /* HUD & Overlay Elements */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .coin-counter {
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #facc15;
            border: 2px solid #eab308;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hp-bar-container {
            width: 250px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #ef4444;
            border-radius: 12px;
            padding: 4px;
            position: relative;
        }

        .hp-bar-fill {
            height: 20px;
            width: 100%;
            background: linear-gradient(90deg, #ef4444, #22c55e);
            border-radius: 8px;
            transition: width 0.2s ease;
        }

        .hp-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 14px;
            font-weight: bold;
            text-shadow: 1px 1px 2px #000;
        }

        /* Shop Modal */
        #shop-btn {
            pointer-events: auto;
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.1s, background 0.2s;
        }

        #shop-btn:hover {
            background: #2563eb;
            transform: scale(1.05);
        }

        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            z-index: 10;
        }

        .hidden {
            display: none !important;
        }

        .shop-card {
            background: #262626;
            border: 2px solid #404040;
            border-radius: 20px;
            width: 90%;
            max-width: 450px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .shop-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #404040;
            padding-bottom: 10px;
        }

        .close-btn {
            background: transparent;
            border: none;
            color: #a3a3a3;
            font-size: 24px;
            cursor: pointer;
        }

        .shop-item {
            background: #171717;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .shop-item-info h3 {
            font-size: 18px;
            color: #f3f4f6;
            margin-bottom: 4px;
        }

        .shop-item-info p {
            font-size: 13px;
            color: #9ca3af;
        }

        .buy-btn {
            background: #eab308;
            color: #000;
            border: none;
            padding: 10px 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .buy-btn:disabled {
            background: #525252;
            color: #a3a3a3;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div id="game-container"></div>

    <div id="ui-layer">
        <div class="hud-top">
            <div class="coin-counter">
                <span>🪙</span>
                <span id="coin-count">0</span>
            </div>

            <div class="hp-bar-container">
                <div id="hp-bar-fill" class="hp-bar-fill"></div>
                <div id="hp-text" class="hp-text">1000 / 1000 HP</div>
            </div>

            <button id="shop-btn">🏪 חנות</button>
        </div>
    </div>

    <!-- Shop Modal -->
    <div id="shop-modal" class="modal-overlay hidden">
        <div class="shop-card">
            <div class="shop-header">
                <h2>חנות שדרוגים</h2>
                <button id="close-shop-btn" class="close-btn">✖</button>
            </div>
            <div class="shop-body">
                <div class="shop-item">
                    <div class="shop-item-info">
                        <h3>🎖️ תותח צבאי משוריין</h3>
                        <p>שריון כבד, קנים כפולים ו-10,000 HP!</p>
                    </div>
                    <button id="buy-super-cannon-btn" class="buy-btn">🪙 3000</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Import Three.js Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
