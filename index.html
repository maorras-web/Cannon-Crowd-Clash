<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cannon Crowd Clash - Remastered Physics</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { overflow: hidden; background: #05050a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        
        /* UI Overlay */
        #ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
            padding: 20px; box-sizing: border-box;
        }
        .hud-header {
            display: flex; justify-content: space-between; align-items: center;
        }
        .badge {
            background: rgba(5, 5, 20, 0.75); border: 2px solid #00f3ff;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
            color: #fff; padding: 10px 20px; border-radius: 20px;
            font-weight: bold; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px;
        }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui">
        <div class="hud-header">
            <div class="badge" id="score-display">SCORE: 0</div>
            <div class="badge" id="level-display">LEVEL 1</div>
        </div>
    </div>

    <script>
        // --- SETUP SCENE & CAMERA ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x05050a, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 18, 25);
        camera.lookAt(0, 2, -10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // --- LIGHTS ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0x00f3ff, 1.2);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- TRACK & GRID ---
        const trackGeo = new THREE.PlaneGeometry(14, 200);
        const trackMat = new THREE.MeshStandardMaterial({ color: 0x0a0a16, roughness: 0.4 });
        const track = new THREE.Mesh(trackGeo, trackMat);
        track.rotation.x = -Math.PI / 2;
        track.position.z = -90;
        track.receiveShadow = true;
        scene.add(track);

        const grid = new THREE.GridHelper(14, 20, 0x00f3ff, 0x112244);
        grid.position.set(0, 0.05, -90);
        grid.scale.z = 10;
        scene.add(grid);

        // --- CANNON (PLAYER) WITH RECOIL ANIMATION ---
        const cannonGroup = new THREE.Group();
        cannonGroup.position.set(0, 0, 5);

        const baseGeo = new THREE.SphereGeometry(1.2, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2);
        const baseMat = new THREE.MeshStandardMaterial({ color: 0x8000ff, roughness: 0.2, metalness: 0.8 });
        const cannonBase = new THREE.Mesh(baseGeo, baseMat);
        cannonBase.position.y = 0;
        cannonGroup.add(cannonBase);

        const ringGeo = new THREE.TorusGeometry(1.3, 0.1, 16, 32);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x00f3ff });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2;
        ring.position.y = 0.1;
        cannonGroup.add(ring);

        scene.add(cannonGroup);

        // --- CONTROLS & INPUT ---
        let targetX = 0;
        let isPointerDown = false;
        let lastPointerX = 0;

        window.addEventListener('pointerdown', (e) => {
            isPointerDown = true;
            lastPointerX = e.clientX;
        });

        window.addEventListener('pointermove', (e) => {
            if (!isPointerDown) return;
            const deltaX = (e.clientX - lastPointerX) * 0.035;
            targetX += deltaX;
            targetX = Math.max(-5.5, Math.min(5.5, targetX));
            lastPointerX = e.clientX;
        });

        window.addEventListener('pointerup', () => isPointerDown = false);

        // --- AUDIO SYSTEM (Web Audio API) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playShootSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        // --- CROWD & BULLET PHYSICS SYSTEM ---
        const bullets = [];
        const bulletGeo = new THREE.SphereGeometry(0.35, 16, 16);
        const bulletMat = new THREE.MeshStandardMaterial({ 
            color: 0x00f3ff, 
            emissive: 0x00aaff, 
            emissiveIntensity: 0.8,
            roughness: 0.1 
        });

        let lastShootTime = 0;
        const SHOOT_INTERVAL = 120; // ms
        let score = 0;

        function spawnBullet() {
            const mesh = new THREE.Mesh(bulletGeo, bulletMat);
            mesh.castShadow = true;
            mesh.position.set(
                cannonGroup.position.x + (Math.random() - 0.5) * 0.4,
                0.5,
                cannonGroup.position.z - 0.8
            );

            // Give initial impulse forward + sideways spread
            bullets.push({
                mesh: mesh,
                vx: (Math.random() - 0.5) * 0.05,
                vz: -0.45 - Math.random() * 0.05,
                radius: 0.35
            });

            scene.add(mesh);
            playShootSound();

            // Cannon Recoil Animation
            cannonGroup.position.z = 5.3;
            cannonGroup.scale.set(1.15, 0.85, 1.15);
        }

        // --- UPDATE FLOCKING & CROWD SEPARATION ---
        function updateBullets() {
            const separationDistance = 0.75;
            const separationForce = 0.015;

            for (let i = 0; i < bullets.length; i++) {
                const b1 = bullets[i];

                // Move forward
                b1.mesh.position.z += b1.vz;
                b1.mesh.position.x += b1.vx;

                // Dampen horizontal velocity gradually
                b1.vx *= 0.92;

                // Flocking: Separation (Push away if overlapping)
                for (let j = i + 1; j < bullets.length; j++) {
                    const b2 = bullets[j];
                    const dx = b2.mesh.position.x - b1.mesh.position.x;
                    const dz = b2.mesh.position.z - b1.mesh.position.z;
                    const dist = Math.hypot(dx, dz);

                    if (dist < separationDistance && dist > 0) {
                        const force = (separationDistance - dist) * separationForce;
                        const pushX = (dx / dist) * force;
                        const pushZ = (dz / dist) * force;

                        b1.mesh.position.x -= pushX;
                        b1.mesh.position.z -= pushZ;
                        b2.mesh.position.x += pushX;
                        b2.mesh.position.z += pushZ;
                    }
                }

                // Track Boundary Limits
                b1.mesh.position.x = Math.max(-6.2, Math.min(6.2, b1.mesh.position.x));

                // Cleanup far bullets
                if (b1.mesh.position.z < -180) {
                    scene.remove(b1.mesh);
                    bullets.splice(i, 1);
                    i--;
                }
            }
        }

        // --- GAME LOOP ---
        function animate(time) {
            requestAnimationFrame(animate);

            // 1. Smooth Cannon Movement (Lerp)
            cannonGroup.position.x += (targetX - cannonGroup.position.x) * 0.15;

            // 2. Cannon Elastic Recoil Recovery
            cannonGroup.position.z += (5 - cannonGroup.position.z) * 0.2;
            cannonGroup.scale.x += (1 - cannonGroup.scale.x) * 0.2;
            cannonGroup.scale.y += (1 - cannonGroup.scale.y) * 0.2;
            cannonGroup.scale.z += (1 - cannonGroup.scale.z) * 0.2;

            // 3. Continuous Shooting
            if (time - lastShootTime > SHOOT_INTERVAL) {
                spawnBullet();
                lastShootTime = time;
                score += 10;
                document.getElementById('score-display').innerText = `SCORE: ${score}`;
            }

            // 4. Update Physics & Crowd Dynamics
            updateBullets();

            renderer.render(scene, camera);
        }

        // --- WINDOW RESIZE ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start Loop
        animate(0);
    </script>
</body>
</html>
