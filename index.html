<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cannon Crowd Clash - Juice Effects</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000000; /* רקע שחור נקי */
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #instructions {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: #ffffff;
            font-family: Arial, sans-serif;
            font-size: 18px;
            pointer-events: none;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }
    </style>
    <!-- טעינת Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="instructions">לחץ על המסך כדי לירות בתותח!</div>

    <script>
        // ==========================================
        // 1. הגדרת הסצנה, המצלמה והרנדרר
        // ==========================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000); // רקע שחור סטטי

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        // מיקום הבסיס של המצלמה (קריטי עבור Camera Shake)
        const ORIGINAL_CAMERA_POS = new THREE.Vector3(0, 4, 8);
        camera.position.copy(ORIGINAL_CAMERA_POS);
        camera.lookAt(0, 1, -5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // אופטימיזציה למובייל
        document.body.appendChild(renderer.domElement);

        // ==========================================
        // 2. תאורה
        // ==========================================
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        // ==========================================
        // 3. יצירת התותח והמטרות
        // ==========================================
        
        // גוף התותח (קבוצה)
        const cannonGroup = new THREE.Group();
        scene.add(cannonGroup);

        // קנה התותח
        const barrelGeometry = new THREE.CylinderGeometry(0.3, 0.4, 1.5, 16);
        const barrelMaterial = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.8, roughness: 0.2 });
        const barrel = new THREE.Mesh(barrelGeometry, barrelMaterial);
        barrel.rotation.x = Math.PI / 2; // השכבת הקנה קדימה
        barrel.position.set(0, 0.5, 0);
        cannonGroup.add(barrel);

        // מיקום הבסיס של התותח (קריטי עבור Recoil)
        const ORIGINAL_CANNON_Z = 3;
        cannonGroup.position.set(0, 0, ORIGINAL_CANNON_Z);

        // מערכים לניהול כדורים ומטרות
        const bullets = [];
        const targets = [];

        // יצירת מטרה/אויב לדוגמה
        function createTarget(x, z, color = 0xff4444, isBoss = false) {
            const size = isBoss ? 1.2 : 0.6;
            const geo = new THREE.BoxGeometry(size, size, size);
            const mat = new THREE.MeshStandardMaterial({ color: color });
            const target = new THREE.Mesh(geo, mat);
            target.position.set(x, size / 2, z);
            target.userData = { isBoss: isBoss, hp: isBoss ? 3 : 1 };
            scene.add(target);
            targets.push(target);
        }

        // יצירת מטרה רגילה ובוס
        createTarget(0, -4, 0xff4444, false); // אויב רגיל
        createTarget(2, -6, 0xffbb00, true);  // בוס

        // ==========================================
        // 4. משתנים לאפקטים (JUICE VARIABLES)
        // ==========================================
        let shakeIntensity = 0;   // עוצמת רעד המצלמה
        const shakeDecay = 0.88;  // קצב נחתית הרעד בכל פריים

        let recoilOffset = 0;     // כמה התותח נדחף אחורה
        const recoilDecay = 0.82;  // קצב חזרת התותח למקום

        // ==========================================
        // 5. מנגנון ירייה ושליטה
        // ==========================================
        function shoot() {
            // 1. יצירת כדור
            const bulletGeo = new THREE.SphereGeometry(0.2, 8, 8);
            const bulletMat = new THREE.MeshBasicMaterial({ color: 0xffdd00 });
            const bullet = new THREE.Mesh(bulletGeo, bulletMat);
            
            bullet.position.set(cannonGroup.position.x, 0.5, cannonGroup.position.z - 0.8);
            scene.add(bullet);
            bullets.push(bullet);

            // 2. הפעלת רתע לתותח (דוחף אחורה בציר Z)
            recoilOffset = 0.4; 

            // 3. רעד קל מאוד במצלמה מעצם הירייה
            shakeIntensity = Math.max(shakeIntensity, 0.05);
        }

        // אירוע לחיצה (עובד גם במחשב וגם במובייל)
        window.addEventListener('pointerdown', () => {
            shoot();
        });

        // התאמת גודל מסך בזמן שינוי חלון/סיבוב מסך במובייל
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ==========================================
        // 6. לולאת ה-ANIMATION הראשית
        // ==========================================
        function animate() {
            requestAnimationFrame(animate);

            // --- א. עדכון תנועת כדורים בדיקת פגיעות ---
            for (let i = bullets.length - 1; i >= 0; i--) {
                const bullet = bullets[i];
                bullet.position.z -= 0.3; // תנועה קדימה

                // בדיקת פגיעה במטרות
                for (let j = targets.length - 1; j >= 0; j--) {
                    const target = targets[j];
                    const dist = bullet.position.distanceTo(target.position);

                    if (dist < 0.8) { // יש פגיעה!
                        scene.remove(bullet);
                        bullets.splice(i, 1);

                        target.userData.hp--;

                        if (target.userData.isBoss) {
                            // פגיעה בבוס -> רעד חזק!
                            shakeIntensity = 0.35;
                        } else {
                            // השמדת אויב רגיל -> רעד בינוני
                            shakeIntensity = 0.18;
                        }

                        // אם המטרה הושמדה
                        if (target.userData.hp <= 0) {
                            scene.remove(target);
                            targets.splice(j, 1);

                            // יצירת מטרה חדשה בלולאה כדי שהמשחק לא ייגמר
                            setTimeout(() => {
                                createTarget((Math.random() - 0.5) * 4, -4 - Math.random() * 4, 0xff4444, false);
                            }, 1000);
                        }
                        break;
                    }
                }

                // הסרת כדור שיצא מהמסך
                if (bullet && bullet.position.z < -15) {
                    scene.remove(bullet);
                    bullets.splice(i, 1);
                }
            }

            // --- ב. חישוב והחלת הרתע לתותח (RECOIL) ---
            if (recoilOffset > 0.001) {
                recoilOffset *= recoilDecay; // דעיכה הדרגתית
            } else {
                recoilOffset = 0;
            }
            // החלת הזזה אחורה על ציר Z
            cannonGroup.position.z = ORIGINAL_CANNON_Z + recoilOffset;

            // --- ג. חישוב והחלת רעד המצלמה (CAMERA SHAKE) ---
            if (shakeIntensity > 0.001) {
                // הוספת היסט רנדומלי קטן למיקום המקורי של המצלמה
                camera.position.x = ORIGINAL_CAMERA_POS.x + (Math.random() - 0.5) * shakeIntensity;
                camera.position.y = ORIGINAL_CAMERA_POS.y + (Math.random() - 0.5) * shakeIntensity;

                shakeIntensity *= shakeDecay; // דעיכה מהירה של הרעד
            } else {
                // החזרת המצלמה בדיוק למיקום המקורי
                camera.position.x = ORIGINAL_CAMERA_POS.x;
                camera.position.y = ORIGINAL_CAMERA_POS.y;
                shakeIntensity = 0;
            }

            // --- ד. רינדור הסצנה ---
            renderer.render(scene, camera);
        }

        // התחלת הלולאה
        animate();
    </script>
</body>
</html>
