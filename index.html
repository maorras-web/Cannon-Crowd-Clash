<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spike Wheel Runner 3D</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #mobile-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 480px;
            background-color: #020208;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        #ui {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            display: flex;
            justify-content: space-between;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            pointer-events: none;
            z-index: 10;
        }

        .hud-card {
            background: rgba(5, 10, 25, 0.85);
            padding: 8px 14px;
            border-radius: 12px;
            border: 2px solid rgba(0, 255, 255, 0.6);
            box-shadow: 0 0 12px rgba(0, 255, 255, 0.3);
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.8);
        }

        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 2, 10, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: #fff;
            padding: 20px;
        }

        #start-screen h1 {
            font-size: 30px;
            margin-bottom: 10px;
            color: #00ffff;
            text-shadow: 0 0 15px #00ffff;
            text-align: center;
            letter-spacing: 2px;
        }

        #start-screen p {
            font-size: 15px;
            color: #aaa;
            margin-bottom: 30px;
            text-align: center;
        }

        .btn-start {
            padding: 16px 42px;
            font-size: 20px;
            font-weight: bold;
            color: #020208;
            background: #00ffff;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px #00ffff;
            transition: transform 0.2s, background 0.2s;
        }

        .btn-start:active {
            transform: scale(0.95);
            background: #00cccc;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="mobile-wrapper">
        <div id="start-screen">
            <h1>SPIKE WHEEL RUNNER</h1>
            <p>Drag left & right to steer your wheel</p>
            <button class="btn-start" id="start-btn">START RUN</button>
        </div>

        <div id="ui">
            <div class="hud-card" id="score">DISTANCE: 0m</div>
            <div class="hud-card" id="level">STAGE 1</div>
        </div>

        <div id="canvas-container"></div>
    </div>

    <script>
        let gameStarted = false;

        // --- 1. SETUP SCENE & RENDERER ---
        const wrapper = document.getElementById('mobile-wrapper');
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x02020a, 0.012);

        const camera = new THREE.PerspectiveCamera(65, wrapper.clientWidth / wrapper.clientHeight, 0.1, 1000);
        camera.position.set(0, 7.5, 13);
        camera.lookAt(0, 1, -20);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(wrapper.clientWidth, wrapper.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // --- 2. LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0x00ffff, 1.2);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        const wheelSpotLight = new THREE.PointLight(0x00ffff, 2.5, 12);
        wheelSpotLight.position.set(0, 4, 3);
        scene.add(wheelSpotLight);

        // --- 3. TRACK & STARS ---
        const canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 256;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#050515';
        ctx.fillRect(0, 0, 256, 256);
        ctx.strokeStyle = '#00ffff';
        ctx.lineWidth = 4;
        ctx.strokeRect(0, 0, 256, 256);

        const gridTexture = new THREE.CanvasTexture(canvas);
        gridTexture.wrapS = THREE.RepeatWrapping;
        gridTexture.wrapT = THREE.RepeatWrapping;
        gridTexture.repeat.set(4, 40);

        const trackGeo = new THREE.PlaneGeometry(14, 300);
        const trackMat = new THREE.MeshStandardMaterial({ map: gridTexture, roughness: 0.2, metalness: 0.8 });
        const track = new THREE.Mesh(trackGeo, trackMat);
        track.rotation.x = -Math.PI / 2;
        track.position.z = -140;
        scene.add(track);

        const edgeGeo = new THREE.BoxGeometry(0.3, 0.3, 300);
        const edgeMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
        const leftEdge = new THREE.Mesh(edgeGeo, edgeMat);
        leftEdge.position.set(-7, 0.15, -140);
        const rightEdge = new THREE.Mesh(edgeGeo, edgeMat);
        rightEdge.position.set(7, 0.15, -140);
        scene.add(leftEdge, rightEdge);

        // Round Stars
        function createRoundStarTexture() {
            const starCanvas = document.createElement('canvas');
            starCanvas.width = 32;
            starCanvas.height = 32;
            const starCtx = starCanvas.getContext('2d');
            const gradient = starCtx.createRadialGradient(16, 16, 0, 16, 16, 16);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.3, 'rgba(255, 255, 255, 0.8)');
            gradient.addColorStop(0.8, 'rgba(255, 255, 255, 0.1)');
            gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
            starCtx.fillStyle = gradient;
            starCtx.beginPath();
            starCtx.arc(16, 16, 16, 0, Math.PI * 2);
            starCtx.fill();
            return new THREE.CanvasTexture(starCanvas);
        }

        const starsGeo = new THREE.BufferGeometry();
        const starsCount = 4500;
        const starPos = new Float32Array(starsCount * 3);
        for(let i = 0; i < starsCount * 3; i++) {
            starPos[i] = (Math.random() - 0.5) * 350;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starsMat = new THREE.PointsMaterial({ 
            color: 0xffffff, size: 1.2, map: createRoundStarTexture(), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false 
        });
        scene.add(new THREE.Points(starsGeo, starsMat));

        // --- 4. BUILD SPIKE WHEEL PLAYER ---
        const playerGroup = new THREE.Group();
        const wheelGroup = new THREE.Group(); // Inner group for rolling spin

        // Wheel Base Cylinder
        const wheelCenterGeo = new THREE.CylinderGeometry(1.2, 1.2, 0.6, 24);
        const wheelCenterMat = new THREE.MeshStandardMaterial({ color: 0x111122, metalness: 0.9, roughness: 0.1 });
        const wheelCenter = new THREE.Mesh(wheelCenterGeo, wheelCenterMat);
        wheelCenter.rotation.z = Math.PI / 2; // Orient wheel upright
        wheelGroup.add(wheelCenter);

        // Glowing Outer Rim
        const rimGeo = new THREE.TorusGeometry(1.22, 0.08, 16, 32);
        const rimMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
        const rim = new THREE.Mesh(rimGeo, rimMat);
        rim.rotation.y = Math.PI / 2;
        wheelGroup.add(rim);

        // Spikes on Both Sides & Outer Rim
        const spikeCount = 8;
        const spikeGeo = new THREE.ConeGeometry(0.2, 0.7, 12);
        const spikeMat = new THREE.MeshStandardMaterial({ color: 0xff0055, emissive: 0xaa0033, metalness: 0.8 });

        for (let i = 0; i < spikeCount; i++) {
            const angle = (i / spikeCount) * Math.PI * 2;

            // Outer Spikes
            const outerSpike = new THREE.Mesh(spikeGeo, spikeMat);
            outerSpike.position.set(0, Math.cos(angle) * 1.35, Math.sin(angle) * 1.35);
            outerSpike.rotation.x = -angle;
            wheelGroup.add(outerSpike);

            // Left Side Spikes
            const leftSpike = new THREE.Mesh(spikeGeo, spikeMat);
            leftSpike.position.set(-0.35, Math.cos(angle) * 1.0, Math.sin(angle) * 1.0);
            leftSpike.rotation.z = Math.PI / 2;
            wheelGroup.add(leftSpike);

            // Right Side Spikes
            const rightSpike = new THREE.Mesh(spikeGeo, spikeMat);
            rightSpike.position.set(0.35, Math.cos(angle) * 1.0, Math.sin(angle) * 1.0);
            rightSpike.rotation.z = -Math.PI / 2;
            wheelGroup.add(rightSpike);
        }

        playerGroup.add(wheelGroup);

        // Ground Glow under Wheel
        const glowCanvas = document.createElement('canvas');
        glowCanvas.width = 64; glowCanvas.height = 64;
        const gCtx = glowCanvas.getContext('2d');
        const gGrad = gCtx.createRadialGradient(32, 32, 0, 32, 32, 32);
        gGrad.addColorStop(0, 'rgba(255, 0, 85, 0.6)');
        gGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        gCtx.fillStyle = gGrad; gCtx.fillRect(0, 0, 64, 64);

        const groundGlow = new THREE.Mesh(
            new THREE.PlaneGeometry(3.0, 3.0),
            new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(glowCanvas), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending })
        );
        groundGlow.rotation.x = -Math.PI / 2;
        groundGlow.position.y = 0.05;
        playerGroup.add(groundGlow);

        playerGroup.position.set(0, 1.4, 2);
        scene.add(playerGroup);

        // --- 5. DEMO PORTAL ON THE TRACK ---
        function createPortal() {
            const portalGroup = new THREE.Group();
            
            const ringGeo = new THREE.TorusGeometry(2.5, 0.15, 16, 32);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
            const ringMesh = new THREE.Mesh(ringGeo, ringMat);
            ringMesh.name = "portalRing";
            portalGroup.add(ringMesh);

            const innerGeo = new THREE.CircleGeometry(2.4, 32);
            const innerMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.35, side: THREE.DoubleSide });
            const innerMesh = new THREE.Mesh(innerGeo, innerMat);
            portalGroup.add(innerMesh);

            const pLight = new THREE.PointLight(0x00ffff, 3, 15);
            portalGroup.add(pLight);

            portalGroup.position.set(0, 2.5, -80);
            return portalGroup;
        }

        const activePortal = createPortal();
        scene.add(activePortal);

        // --- 6. CONTROLS & GAME LOOP ---
        let targetX = 0;
        let distanceCovered = 0;
        const clock = new THREE.Clock();

        function handlePointerMove(e) {
            if (!gameStarted) return;
            const rect = wrapper.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const relativeX = clientX - rect.left;
            const normalizedX = (relativeX / rect.width) * 2 - 1;
            targetX = Math.max(-4.2, Math.min(4.2, normalizedX * 5.0));
        }

        wrapper.addEventListener('pointermove', handlePointerMove);
        wrapper.addEventListener('touchmove', handlePointerMove, { passive: true });

        document.getElementById('start-btn').addEventListener('click', () => {
            gameStarted = true;
            document.getElementById('start-screen').style.display = 'none';
        });

        function animate() {
            requestAnimationFrame(animate);

            if (!gameStarted) {
                renderer.render(scene, camera);
                return;
            }

            const elapsedTime = clock.getElapsedTime();

            // Smooth Movement & Steering Tilt
            const prevX = playerGroup.position.x;
            playerGroup.position.x += (targetX - playerGroup.position.x) * 0.18;
            const velocityX = playerGroup.position.x - prevX;

            playerGroup.rotation.z = -velocityX * 1.2;
            playerGroup.rotation.y = -velocityX * 0.4;

            // Rolling Wheel Spin Animation
            wheelGroup.rotation.x -= 0.18;

            // Update Light position to follow wheel
            wheelSpotLight.position.x = playerGroup.position.x;

            // Animate Track Movement & Distance Score
            gridTexture.offset.y -= 0.02;
            distanceCovered += 0.4;
            document.getElementById('score').innerText = `DISTANCE: ${Math.floor(distanceCovered)}m`;

            // Animate Portal
            activePortal.position.z += 0.4;
            const ring = activePortal.getObjectByName("portalRing");
            if (ring) ring.rotation.z += 0.03;

            // Loop Portal back when passed
            if (activePortal.position.z > 10) {
                activePortal.position.z = -120;
                activePortal.position.x = (Math.random() - 0.5) * 8.0;
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = wrapper.clientWidth / wrapper.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(wrapper.clientWidth, wrapper.clientHeight);
        });

        animate();
    </script>
</body>
</html>
