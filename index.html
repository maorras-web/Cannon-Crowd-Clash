<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cannon Clash</title>
    <!-- Google Font: Rubik -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- HUD Elements -->
    <div id="ui-container">
        <div id="score-card" class="hidden">
            <span class="score-label">SCORE</span>
            <div id="score-val">0</div>
        </div>
        <button id="pause-btn" class="icon-btn hidden">❚❚</button>
    </div>

    <!-- Start Overlay (English UI) -->
    <div id="start-overlay">
        <div id="start-menu">
            <div class="header-section">
                <h1 class="game-title">CANNON<br>CLASH</h1>
                <p class="game-subtitle">Destroy gates, eliminate lizardmen & set a high score!</p>
            </div>

            <!-- Cannon Color Picker -->
            <div class="customization-section">
                <span class="section-label">Select Cannon Color</span>
                <div class="color-picker">
                    <button class="color-btn active" data-color="0xdc2626" style="background: #dc2626;"></button>
                    <button class="color-btn" data-color="0x2563eb" style="background: #2563eb;"></button>
                    <button class="color-btn" data-color="0x16a34a" style="background: #16a34a;"></button>
                    <button class="color-btn" data-color="0x9333ea" style="background: #9333ea;"></button>
                </div>
            </div>

            <!-- Start Button -->
            <div class="action-section">
                <button id="start-btn">START GAME</button>
            </div>
        </div>
    </div>

    <!-- Pause Menu -->
    <div id="pause-menu" class="hidden">
        <div class="pause-card">
            <h2>GAME PAUSED</h2>
            <div class="volume-control">
                <label for="volume-slider">Volume 🔊</label>
                <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.25">
            </div>
            <button id="resume-btn">RESUME</button>
        </div>
    </div>

    <!-- The v=3 forces mobile browsers to clear cache and load fresh JS -->
    <script src="main.js?v=3"></script>
</body>
</html>
