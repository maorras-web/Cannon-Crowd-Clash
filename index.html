<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cannon Crowd Clash</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #050714;
            font-family: 'Rubik', system-ui, -apple-system, sans-serif;
            touch-action: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        /* UI overlay elements */
        .hud-container {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            pointer-events: none;
        }

        /* HP Bar Container */
        #hp-container {
            position: relative;
            width: 200px;
            height: 26px;
            background-color: rgba(15, 23, 42, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
        }

        #hp-bar {
            width: 100%;
            height: 100%;
            background-color: #22c55e;
            box-shadow: 0 0 12px #22c55e;
            transition: width 0.25s ease-out, background-color 0.3s ease, box-shadow 0.3s ease;
        }

        #hp-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff;
            font-weight: 700;
            font-size: 13px;
            text-shadow: 0px 1px 3px rgba(0, 0, 0, 0.9);
            letter-spacing: 0.5px;
        }

        /* Score Card */
        #score-card {
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.8);
            padding: 6px 16px;
            border-radius: 8px;
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
        }

        /* Controls / Audio Menu */
        .audio-control {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(15, 23, 42, 0.8);
            padding: 8px 12px;
            border-radius: 8px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        /* Overlay Menus */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(5, 7, 20, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            color: #fff;
            transition: opacity 0.4s ease;
        }

        .hidden {
            display: none !important;
        }

        .btn {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            padding: 14px 36px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
            transition: transform 0.1s, background 0.2s;
            margin-top: 20px;
        }

        .btn:active {
            transform: scale(0.95);
        }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- HUD Overlay -->
    <div class="hud-container">
        <!-- HP Bar -->
        <div id="hp-container">
            <div id="hp-bar"></div>
            <span id="hp-text">500 / 500</span>
        </div>

        <!-- Score -->
        <div id="score-card" class="hidden">
            ניקוד: <span id="score-val">0</span>
        </div>
    </div>

    <!-- Volume Control -->
    <div class="audio-control">
        <label for="volume-slider">ווליום:</label>
        <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.25">
    </div>

    <!-- Start Overlay -->
    <div id="start-overlay" class="overlay">
        <h1 style="font-size: 36px; margin-bottom: 10px;">Cannon Crowd Clash</h1>
        <p style="font-size: 16px; color: #cbd5e1;">גרור את המסך כדי להזיז את התותח</p>
        <button id="start-btn" class="btn">התחל משחק</button>
    </div>

    <!-- Pause Overlay -->
    <div id="pause-menu" class="overlay hidden">
        <h2>משחק מוקפא</h2>
        <button id="resume-btn" class="btn">המשך</button>
    </div>

    <script src="main.js"></script>
</body>
</html>
